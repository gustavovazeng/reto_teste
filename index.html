// Deduplicação de eventos webhook:
// Mesma pessoa + mesmo produto + dentro de 7 dias → mantém o mais recente por data/hora
// Se data/hora igual → hierarquia: Reembolsado > Aguardando Reembolso > Paga > Em Recuperacao > Expirado > outros
function deduplicateFunilRows(rows){
  const STATUS_PRIORITY={"Reembolsado":6,"Aguardando Reembolso":5,"Paga":4,"Em Recuperacao":3,"Expirado":2,"Aberta":1,"":0};
  function sp(st){ return STATUS_PRIORITY[st]||0; }

  // Chave: email+cpf+tel+produto+janela7dias
  // Agrupa por chave e mantém o de maior prioridade/data
  const groups=new Map();
  for(const r of rows){
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    const prod=(r["Nome do produto"]||"").trim().toUpperCase();
    const dataBruta=r["Data da compra"]||"";
    const dateStr=toISO(dataBruta)||"";
    const identity=em||cpf||tel;
    if(!identity||!prod||!dateStr) { /* sem chave — adiciona direto */ groups.set(Math.random().toString(),r); continue; }

    // Encontra grupo existente com mesma identidade + produto dentro de 7 dias
    let found=null;
    for(const [k,g] of groups){
      if(!g._identity||!g._prod) continue;
      if(g._prod!==prod) continue;
      // verifica identidade
      const gEm=(g["Email"]||"").toLowerCase().trim();
      const gCpf=(g["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const gTel=(g["Telefone"]||"").replace(/[^\d]/g,"");
      const identMatch=(em&&gEm&&em===gEm)||(cpf&&gCpf&&cpf===gCpf)||(tel&&gTel&&tel===gTel);
      if(!identMatch) continue;
      // verifica janela 7 dias
      const d1=new Date((g._dateStr||"")+"T12:00:00Z");
      const d2=new Date(dateStr+"T12:00:00Z");
      const diffDays=Math.abs((d2-d1)/(86400000));
      if(diffDays<=7){ found=k; break; }
    }

    const rWithMeta={...r,_identity:identity,_prod:prod,_dateStr:dateStr};
    if(found){
      const existing=groups.get(found);
      // Mantém o mais recente; se empate, maior prioridade de status
      const existDate=existing._dateStr||"";
      const newDate=dateStr;
      const existSP=sp(existing["Status da compra"]||"");
      const newSP=sp(r["Status da compra"]||"");
      if(newDate>existDate||(newDate===existDate&&newSP>existSP)){
        groups.set(found,rWithMeta);
      }
    } else {
      groups.set(Math.random().toString(),rWithMeta);
    }
  }
  return Array.from(groups.values());
}

function buildFunilData(rows, start, end, funil){
  const f=funil||"reto";
  const primaryId="reto"; // produto de entrada do funil
  // filtered: só para análise de status/perdas — respeita período
  const filtered = rows.filter(r=>{
    if(!start && !end) return true;
    const d = toISO(r["Data da compra"]||r["Data"]);
    if(!d) return true;
    if(start && d<start) return false;
    if(end   && d>end)   return false;
    return true;
  });

  // Para buyers: usa TODAS as linhas (sem filtro de período)
  // O período só controla se a compra entra nos totais, não quem é o comprador
  const allRows = rows;

  // Agrupa por comprador (e-mail + cpf + telefone)
  // Identifica o comprador único
  function buyerKey(r){
    // Retorna chaves únicas: cada campo é prefixado para evitar colisão entre email/cpf/tel
    const keys=[];
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    if(em)  keys.push("e:"+em);
    if(cpf) keys.push("c:"+cpf);
    if(tel) keys.push("t:"+tel);
    return keys;
  }

  // Mapeia comprador -> conjunto de produtos comprados com data
  // Estrutura: {keys: Set, products: [{id, date, valor, status}]}
  const buyers = new Map(); // normalizedKey -> buyer obj

  function getOrCreate(r){
    const keys = buyerKey(r);
    // procura buyer existente que compartilhe pelo menos 1 chave
    for(const [k,b] of buyers){
      for(const key of keys){
        if(key && b.keys.has(key)){
          // adiciona as novas keys a esse buyer
          keys.forEach(k2=>{ if(k2) b.keys.add(k2); });
          return b;
        }
      }
    }
    // novo buyer
    const b={keys:new Set(keys.filter(Boolean)), products:[]};
    const mapKey = keys[0] || Math.random().toString();
    buyers.set(mapKey, b);
    return b;
  }

  for(const r of allRows){
    const prodId = classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    const buyer = getOrCreate(r);
    const d = toISO(r["Data da compra"]||r["Data"]) || "";
    const status = normalizeStatus((r["Status da compra"]||"").trim());
    const valor  = (parseFloat(r["Valor do produto"])||0);
    const taxa   = parseBRLAbs(r["Taxa da plataforma"]);
    buyer.products.push({id:prodId, date:d, status, valor, taxa});
  }

  // Conta: só conta produtos comprados APÓS a primeira compra do manual (status Paga)
  const counts = {};
  const fat    = {};
  const taxa   = {};
  getFunilSteps(f).forEach(s=>{ counts[s.id]=0; fat[s.id]=0; taxa[s.id]=0; });

  // Status analysis
  const statusCounts = {};
  const statusVals   = {};
  const statusByProd = {};
  getFunilSteps(f).forEach(s=>{ statusByProd[s.id]={}; });

  // All rows for status analysis (sem filtro de funil)
  for(const r of filtered){
    const prodId=classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    const st=normalizeStatus((r["Status da compra"]||"").trim());
    const val=(parseFloat(r["Valor do produto"])||0);
    statusCounts[st]=(statusCounts[st]||0)+1;
    statusVals[st]=(statusVals[st]||0)+val;
    if(!statusByProd[prodId]) statusByProd[prodId]={};
    statusByProd[prodId][st]=(statusByProd[prodId][st]||0)+1;
  }

  // Funil: só Paga, dentro do período
  // OBs de faturamento (produto principal + OBs diretos)
  const OB_FAT_IDS = new Set(["reto"]);

  // Passo 1: agrupa por comprador+data para calcular faturamento do produto principal
  // (evita duplicatas entre webhook e histórica)
  {
    const ST_PRI={"Reembolsado":6,"Aguardando Reembolso":5,"Paga":4,"Em Recuperacao":3,"Expirado":2,"Aberta":1,"":0};
    const grupos=new Map();
    for(const r of filtered){
      const prodId=classifyProduct(r["Nome do produto"],f);
      if(!OB_FAT_IDS.has(prodId)) continue; // só produto principal + OBs diretos aqui
      const st=normalizeStatus((r["Status da compra"]||"").trim());
      if(!st) continue;
      const d=toISO(r["Data da compra"]||r["Data"])||"";
      const em=(r["Email"]||"").toLowerCase().trim();
      const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
      const identity=em||cpf||tel; if(!identity) continue;
      const key=identity+"|"+d;
      if(!grupos.has(key)) grupos.set(key,{st,d,valor:0,taxa:0,hasPrimary:false,obCounts:{}});
      const g=grupos.get(key);
      if((ST_PRI[st]||0)>(ST_PRI[g.st]||0)) g.st=st;
      if(prodId===primaryId) g.hasPrimary=true;
      if(st==="Paga"){
        g.valor += (parseFloat(r["Valor do produto"])||0);
        g.taxa  += parseBRLAbs(r["Taxa da plataforma"]);
        // Conta cada OB individualmente dentro do grupo
        if(prodId!==primaryId) g.obCounts[prodId]=(g.obCounts[prodId]||0)+1;
      }
    }
    for(const [,g] of grupos){
      if(!g.hasPrimary || g.st!=="Paga") continue;
      counts[primaryId]++;
      fat[primaryId] += g.valor;
      taxa[primaryId]+= g.taxa;
      // Contagem dos OBs desta transação
      for(const [obId, obQtd] of Object.entries(g.obCounts)){
        counts[obId]=(counts[obId]||0)+obQtd;
      }
    }
  }

  // Passo 2: upsell e ascensão (planLucro, curso) — por comprador, após produto principal
  for(const [,buyer] of buyers){
    const paid = buyer.products.filter(p=>p.status==="Paga");
    const mainPurchases = paid.filter(p=>p.id===primaryId).sort((a,b)=>a.date.localeCompare(b.date));
    if(!mainPurchases.length) continue;
    const mainDate = mainPurchases[0].date;
    const others = paid.filter(p=>{
      if(OB_FAT_IDS.has(p.id)) return false; // OBs já contados acima
      if(p.date < mainDate) return false;
      if(start && p.date < start) return false;
      if(end   && p.date > end)   return false;
      return true;
    });
    for(const p of others){
      counts[p.id]=(counts[p.id]||0)+1;
      fat[p.id]=(fat[p.id]||0)+p.valor;
      taxa[p.id]=(taxa[p.id]||0)+(p.taxa||0);
    }
  }

  const manualCount = counts[primaryId] || 1;
  const totalFat  = Object.values(fat).reduce((a,b)=>a+b,0);
  // Taxa Eduzz: inclui Paga + Reembolsado + Aguardando Reembolso
  // (Eduzz cobra taxa mesmo em reembolsos)
  const totalTaxaPaga = Object.values(taxa).reduce((a,b)=>a+b,0);
  let totalTaxaReemb = 0;
  for(const r of filtered){
    const st=normalizeStatus((r["Status da compra"]||"").trim());
    if(st!=="Reembolsado" && st!=="Aguardando Reembolso") continue;
    const prodId=classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    totalTaxaReemb += parseBRLAbs(r["Taxa da plataforma"]);
  }
  const totalTaxa = totalTaxaPaga + totalTaxaReemb;

  // Spend no período — respeita filtro de temperatura via getMetaActive()
  let totalSpend=0;
  const _metaD=getMetaActive();
  for(const d of Object.keys(_metaD)){
    if(start && d<start) continue;
    if(end   && d>end)   continue;
    totalSpend+=_metaD[d].spend||0;
  }

  return {
    counts, fat, manualCount, totalFat, totalSpend, buyers,
    roas: totalSpend>0 ? totalFat/totalSpend : 0,
    ltv:  totalFat/manualCount,
    lucro: totalFat - totalTaxa - (totalSpend*TAXA_IMPOSTO),
    taxaAscensao: (function(){
      if(!manualCount) return 0;
      let cnt=0;
      for(const [,buyer] of buyers){
        const paid=buyer.products.filter(p=>p.status==="Paga");
        // compra do Reto deve estar dentro do período filtrado
        const mp=paid.filter(p=>p.id===primaryId
          &&(!start||p.date>=start)&&(!end||p.date<=end))
          .sort((a,b)=>a.date.localeCompare(b.date))[0];
        if(!mp) continue;
        const ascendeu=paid.some(p=>p.id==="cero"&&p.date>=mp.date);
        if(ascendeu) cnt++;
      }
      return (cnt/manualCount)*100;
    })(),
    taxaMapa: (function(){
      const ceroCount=counts["cero"]||0; if(!ceroCount) return 0;
      let cnt=0;
      for(const [,buyer] of buyers){
        const paid=buyer.products.filter(p=>p.status==="Paga");
        // compra do Cero deve estar dentro do período filtrado
        const cp=paid.filter(p=>p.id==="cero"
          &&(!start||p.date>=start)&&(!end||p.date<=end))
          .sort((a,b)=>a.date.localeCompare(b.date))[0];
        if(!cp) continue;
        const comprou=paid.some(p=>p.id==="mapa"&&p.date>=cp.date);
        if(comprou) cnt++;
      }
      return (cnt/ceroCount)*100;
    })(),
    statusCounts, statusVals, statusByProd, buyers,
  };
}

// ── Render Resumo Diário ───────────────────────────────────────────────────
function renderResumo(){
  const el=document.getElementById("page-resumo");if(!el)return;
  const isFeo=S.currentFunil==="feo";
  const funilTitle=isFeo?"Planilla Finanzas en Orden":"Finanzas - Reto 14 Dias";
  const _resumoFocus=document.activeElement?.id;
  const today=todayISO(), yest=yesterdayISO();
  const start=S.startDate||today, end=S.endDate||today;

  // Agrega métricas para um período
  function periodMetrics(s,e){
    const daily=getDailyT(s,e);
    const t=getTotalsT(daily);
    // faturamento (receita) do período — usa getVendasActive() para respeitar filtros de temp/preço
    const vA=getVendasActive();
    let valor=0;
    for(const d of Object.keys(vA).filter(d=>d>=s&&d<=e)) valor+=(vA[d]?.valor||0);
    t.valor=valor;
    t.roas=t.spend>0?valor/t.spend:0;
    t.cpv=t.vendas>0?t.spend/t.vendas:0;
    return t;
  }

  const tot  = periodMetrics(start, end);
  const ontem= periodMetrics(yest,  yest);
  const hojeBase = periodMetrics(today, today);
  const hoje = {...hojeBase};
  if(S.manualSpendHoje!==null){
    hoje.spend=S.manualSpendHoje;
    hoje.cpv=hoje.vendas>0?hoje.spend/hoje.vendas:0;
    hoje.roas=hoje.spend>0?hoje.valor/hoje.spend:0;
  }

  // Emoji de status
  function em(val, meta, higher){
    if(!meta||val===0) return "";
    const ratio=higher ? val/meta : meta/val;
    if(ratio>=1)   return "🟢";
    if(ratio>=0.85) return "🟡";
    return "🔴";
  }

  // Formata data "dd/mm"
  function fDM(iso){ if(!iso) return "—"; const [,m,d]=iso.split("-"); return `${d}/${m}`; }

  // Label do período filtrado
  const dateLabel= start===end ? fDM(start) : `${fDM(start)} a ${fDM(end)}`;

  // Bloco de texto formatado para copiar (WhatsApp markdown)
  function block(label, m, isTotal){
    const _bCpvM=isFeo?getFeoMetaCPV():META_CPV;
    const cpvE  =em(m.cpv,      _bCpvM,                     false);
    const roasE =em(m.roas,     isFeo?null:META_ROAS,        true);
    const pcE   =em(m.txPagChk, isFeo?null:METAS_T.txPagChk.val, true);
    const cvE   =em(m.txChkVnd, isFeo?null:METAS_T.txChkVnd.val, true);
    const cnE   =em(m.connect,  isFeo?null:METAS_T.connect.val,   true);
    const cpcE  =em(m.cpc,      isFeo?null:METAS_T.cpc.val,       false);
    const ctrE  =em(m.ctr,      isFeo?null:METAS_T.ctr.val,       true);
    const cpmE  =em(m.cpm,      isFeo?null:METAS_T.cpm.val,       false);
    const vLabel=isTotal?"Vendas Mensal":"Vendas";
    const cpvLabel=isTotal?"Custo por venda Mensal":"Custo por venda";
    const cpvMeta=_bCpvM?` ${cpvE} $${_bCpvM}`:`  `;
    const pcMeta =isFeo?"":` ${pcE} ${METAS_T.txPagChk.val}%`;
    const cvMeta =isFeo?"":` ${cvE} ${METAS_T.txChkVnd.val}%`;
    const cnMeta =isFeo?"":` ${cnE} ${METAS_T.connect.val}%`;
    const cpcMeta=isFeo?"":` ${cpcE} $${METAS_T.cpc.val}`;
    const ctrMeta=isFeo?"":` ${ctrE} ${METAS_T.ctr.val}%`;
    const cpmMeta=isFeo?"":` ${cpmE} $${METAS_T.cpm.val}`;
    return (
`*-> ${label}*
Investimento:\t${fBRL(m.spend)}\t
${vLabel}:\t${m.vendas}\t
${cpvLabel}:\t${fBRL(m.cpv)}${cpvMeta}
ROAS:\t${m.roas.toFixed(2)}\t

Tx conv PgV-Checkout:\t${m.txPagChk.toFixed(1)}%${pcMeta}
Tx conv Checkout-Vendas:\t${m.txChkVnd.toFixed(1)}%${cvMeta}

function copyResumo(){
  const el=document.getElementById("page-resumo");
  const text=el?._resumoText||"";
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>{
    const btns=document.querySelectorAll("[onclick='copyResumo()']");
    btns.forEach(b=>{const orig=b.innerHTML;b.innerHTML="✓ Copiado!";b.style.color="#4ade80";setTimeout(()=>{b.innerHTML=orig;b.style.color="";},1800);});
  }).catch(()=>{ alert("Não foi possível copiar. Selecione o texto manualmente."); });
}

// ── Distribuição: helpers ─────────────────────────────────────────────────
function getDistDaily(start, end){
  const allDates=new Set([...Object.keys(S.distMeta||{}),...Object.keys(S.distSeg||{})]);
  return [...allDates].filter(d=>d>=start&&d<=end).sort().map(d=>{
    const m=S.distMeta[d]||{};
    const sg=S.distSeg[d]||{};
    const spend=m.spend||0,clicks=m.clicks||0,impressions=m.impressions||0;
    const video3s=m.video3s||0,video15s=m.video15s||0,profileVisits=m.profileVisits||0;
    const seguidores=sg.seguidores||0;
    const ctr=impressions>0?clicks/impressions*100:0;
    const cpm=impressions>0?spend/impressions*1000:0;
    const cpc=clicks>0?spend/clicks:0;
    const hookRate=impressions>0?video3s/impressions*100:0;
    const holdRate=video3s>0?video15s/video3s*100:0;
    const cps=seguidores>0?spend/seguidores:0;
    const cpVisita=profileVisits>0?spend/profileVisits:0;
    const [,mm,dd2]=d.split("-");
    return {date:d,label:`${dd2}/${mm}`,spend,clicks,impressions,video3s,video15s,
      profileVisits,seguidores,ctr,cpm,cpc,hookRate,holdRate,cps,cpVisita};
  });
}

function getDistTotals(start, end){
  const dD=S.distMeta||{};
  let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
  for(const [d,v] of Object.entries(dD)){
    if(d<start||d>end) continue;
    spend+=v.spend; clicks+=v.clicks; impressions+=v.impressions;
    video3s+=v.video3s; video15s+=v.video15s; profileVisits+=v.profileVisits;
  }
  const sD=S.distSeg||{};
  let seguidores=0;
  for(const [d,v] of Object.entries(sD)){
    if(d<start||d>end) continue;
    seguidores+=v.seguidores;
  }
  const ctr=impressions>0?clicks/impressions*100:0;
  const cpm=impressions>0?spend/impressions*1000:0;
  const cpc=clicks>0?spend/clicks:0;
  const hookRate=impressions>0?video3s/impressions*100:0;
  const holdRate=video3s>0?video15s/video3s*100:0;
  const cps=seguidores>0?spend/seguidores:0;
  return {spend,clicks,impressions,video3s,video15s,profileVisits,seguidores,ctr,cpm,cpc,hookRate,holdRate,cps};
}

function renderDistAnuncios(){
  const el=document.getElementById("page-anuncios"); if(!el)return;
  const start=S.startDate, end=S.endDate;

  // ── Build camp rows filtered by date ──────────────────────────────────────
  const campRows=Object.values(S.distMetaByCamp||{}).map(c=>{
    let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
    const byDate=S.distMetaByCampByDate[c.campName]||{};
    for(const [d,v] of Object.entries(byDate)){
      if(d<start||d>end) continue;
      spend+=v.spend;clicks+=v.clicks;impressions+=v.impressions;
      video3s+=v.video3s;video15s+=v.video15s;profileVisits+=v.profileVisits;
    }
    const seg=(S.distSegByCamp[c.campName]||{seguidores:0}).seguidores;
    const ctr=impressions>0?clicks/impressions*100:0;
    const cpm=impressions>0?spend/impressions*1000:0;
    const cpc=clicks>0?spend/clicks:0;
    const cps=seg>0?spend/seg:0;
    const cpVisita=profileVisits>0?spend/profileVisits:0;
    return {campName:c.campName,spend,clicks,impressions,profileVisits,seguidores:seg,ctr,cpm,cpc,cps,cpVisita};
  }).filter(r=>r.spend>0).sort((a,b)=>b.spend-a.spend);

// ── Distribuição: Resumo ──────────────────────────────────────────────────
function renderDistResumo(){
  const el=document.getElementById("page-resumo"); if(!el)return;
  const _resumoFocus=document.activeElement?.id;
  const today=todayISO(), yest=yesterdayISO();
  const start=S.startDate||today, end=S.endDate||today;

  function fD(v){ return "$"+v.toFixed(2).replace(".",","); }
  function fP(v){ return v.toFixed(1).replace(".",",")+"%"; }
  function fN(v){ return v===0?"0":v.toLocaleString("pt-BR"); }
  function fDM(iso){ if(!iso)return "—"; const [,m,d]=iso.split("-"); return `${d}/${m}`; }

  function em(val, meta){
    if(!val||val===0) return "";
    const ratio=meta.higher?val/meta.val:meta.val/val;
    if(ratio>=1)   return "🟢";
    if(ratio>=0.85)return "🟡";
    return "🔴";
  }

  function distMetrics(s, e){
    const dD=S.distMeta||{};
    let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
    for(const [d,v] of Object.entries(dD)){
      if(d<s||d>e) continue;
      spend+=v.spend;clicks+=v.clicks;impressions+=v.impressions;
      video3s+=v.video3s;video15s+=v.video15s;profileVisits+=v.profileVisits;
    }
    const sD=S.distSeg||{};
    let seguidores=0;
    for(const [d,v] of Object.entries(sD)){
      if(d<s||d>e) continue;
      seguidores+=v.seguidores;
    }
    const ctr=impressions>0?clicks/impressions*100:null;
    const cpm=impressions>0?spend/impressions*1000:null;
    const cpc=clicks>0?spend/clicks:null;
    const hookRate=impressions>0?video3s/impressions*100:null;
    const holdRate=video3s>0?video15s/video3s*100:null;
    const cpVisita=profileVisits>0?spend/profileVisits:null;
    const cpSeg=seguidores>0?spend/seguidores:null;
    const txConv=profileVisits>0?seguidores/profileVisits*100:null;
    return {spend,clicks,impressions,profileVisits,seguidores,ctr,cpm,cpc,hookRate,holdRate,cpVisita,cpSeg,txConv};
  }

  const tot  =distMetrics(start,end);
  const ontem=distMetrics(yest,yest);
  const hoje =distMetrics(today,today);

  const dateLabel=start===end?fDM(start):`${fDM(start)} a ${fDM(end)}`;

  // ── Text for copy ─────────────────────────────────────────────────────────
  function textBlock(label, m){
    function line(lbl, val, fmtFn, meta, pad=42){
      const v=val===null?"#DIV/0!":fmtFn(val);
      const dot=meta?(val===null?"":"\t"+(em(val,meta)||"🔴")+" Meta: "+meta.label):"";
      return `${lbl.padEnd(pad," ")}${v}${dot}`;
    }
    return [
      `📶 *${label}*`,``,
      line("Investimento:",         m.spend,       fD,  null),
      line("Visitas ao Perfil:",    m.profileVisits, fN, null),
      line("Custo/Visita:",         m.cpVisita,    fD,  METAS_DIST.cpVisita),
      line("Seguidores:",           m.seguidores,  fN,  null),
      line("Custo/Seguidor:",       m.cpSeg,       fD,  METAS_DIST.cpSeg),``,
      line("Hook Rate (3s/impr.):", m.hookRate,    fP,  METAS_DIST.hookRate),
      line("Hold Rate (15s/3s):",   m.holdRate,    fP,  METAS_DIST.holdRate),
    ].join("\n");
  }

  const fullText=[
    `*Finanzas - Distribuição de Conteúdo*`,``,
    `_${dateLabel}_`,``,
    textBlock("Total", tot),``,``,
    textBlock("Ontem",ontem),``,``,
    textBlock("Hoje",hoje),
  ].join("\n");

  // ── Visual rows ───────────────────────────────────────────────────────────
  function row(lbl, val, fmtFn, meta){
    const fv=val===null?"—":(typeof val==="number"?fmtFn(val):val);
    const badge=meta?em(val,meta):"";
    const metaTxt=meta&&val!==null?`<span style="font-size:10px;color:var(--hint);margin-left:4px">meta ${meta.label}</span>`:"";
    return `<div style="display:grid;grid-template-columns:180px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong)">${fv}</span>
      <span style="font-size:13px;min-width:28px;text-align:right">${badge}${metaTxt}</span>
    </div>`;
  }

  function section(label, m, isHoje=false){
    const planRow=isHoje?`
      <div style="display:grid;grid-template-columns:180px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
        <span style="color:var(--muted);font-size:12px">Plan até hj</span>
        <input id="dist-plan-input"
          value="${S.distPlanHoje||''}"
          placeholder="Digitar plan..."
          oninput="S.distPlanHoje=this.value;renderDistResumo()"
          style="background:var(--surf);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:3px 8px;outline:none;width:100%;box-sizing:border-box">
      </div>`:"";
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">📶 ${label}</div>
      ${row("Investimento", m.spend, fD, null)}
      ${row("Visitas ao Perfil", m.profileVisits, fN, null)}
      ${row("Custo/Visita", m.cpVisita, fD, METAS_DIST.cpVisita)}
      ${row("Seguidores", m.seguidores, fN, null)}
      ${row("Custo/Seguidor", m.cpSeg, fD, METAS_DIST.cpSeg)}
      <div style="height:8px"></div>
      ${row("Hook Rate", m.hookRate, fP, METAS_DIST.hookRate)}
      ${row("Hold Rate", m.holdRate, fP, METAS_DIST.holdRate)}
      ${planRow}
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:16px">
      <div>
        <div class="hdr-title">Resumo diário — Distribuição</div>
        <div class="hdr-sub">período: ${dateLabel} · ontem: ${fDM(yest)} · hoje: ${fDM(today)}</div>
      </div>
      <button id="dist-copy-btn" onclick="distCopyResumo()"
        style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif">
        📋 Copiar resumo
      </button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start">
      <div>
        ${section("Total", tot, false)}
        ${section("Ontem", ontem, false)}
        ${section("Hoje", hoje, true)}
      </div>
      <div style="position:sticky;top:20px">
        <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px">
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">Preview</div>
          <pre id="dist-resumo-pre" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.75;margin:0;user-select:all">${fullText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
        </div>
      </div>
    </div>
    <p class="foot">Ontem e Hoje são sempre datas fixas · Total reflete o filtro de datas do header</p>
  `;

  document.getElementById("dist-resumo-pre")._text=fullText;

  if(_resumoFocus==="dist-plan-input"){
    requestAnimationFrame(()=>{
      const inp=document.getElementById("dist-plan-input");
      if(inp){inp.focus();const l=inp.value.length;inp.setSelectionRange(l,l);}
    });
  }
}

function distCopyResumo(){
  const pre=document.getElementById("dist-resumo-pre");
  const text=pre?._text||"";
  if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{
    const b=document.getElementById("dist-copy-btn");
    if(b){const o=b.innerHTML;b.innerHTML="✓ Copiado!";b.style.color="#4ade80";setTimeout(()=>{b.innerHTML=o;b.style.color="";},1800);}
  }).catch(()=>alert("Selecione o texto manualmente."));
}

// ── Aquecimento Base: helpers ─────────────────────────────────────────────
function getAquecDaily(start, end){
  const allDates=new Set([...Object.keys(S.aquecMeta||{}),...Object.keys(S.aquecSeg||{})]);
  return [...allDates].filter(d=>d>=start&&d<=end).sort().map(d=>{
    const m=S.aquecMeta[d]||{};
    const sg=S.aquecSeg[d]||{};
    const spend=m.spend||0,clicks=m.clicks||0,impressions=m.impressions||0;
    const video3s=m.video3s||0,video15s=m.video15s||0,profileVisits=m.profileVisits||0;
    const seguidores=sg.seguidores||0;
    const ctr=impressions>0?clicks/impressions*100:0;
    const cpm=impressions>0?spend/impressions*1000:0;
    const cpc=clicks>0?spend/clicks:0;
    const hookRate=impressions>0?video3s/impressions*100:0;
    const holdRate=video3s>0?video15s/video3s*100:0;
    const cps=seguidores>0?spend/seguidores:0;
    const cpVisita=profileVisits>0?spend/profileVisits:0;
    const [,mm,dd2]=d.split("-");
    return {date:d,label:`${dd2}/${mm}`,spend,clicks,impressions,video3s,video15s,
      profileVisits,seguidores,ctr,cpm,cpc,hookRate,holdRate,cps,cpVisita};
  });
}

function getAquecTotals(start, end){
  const aD=S.aquecMeta||{};
  let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
  for(const [d,v] of Object.entries(aD)){
    if(d<start||d>end) continue;
    spend+=v.spend; clicks+=v.clicks; impressions+=v.impressions;
    video3s+=v.video3s; video15s+=v.video15s; profileVisits+=v.profileVisits;
  }
  const asD=S.aquecSeg||{};
  let seguidores=0;
  for(const [d,v] of Object.entries(asD)){
    if(d<start||d>end) continue;
    seguidores+=v.seguidores;
  }
  const ctr=impressions>0?clicks/impressions*100:0;
  const cpm=impressions>0?spend/impressions*1000:0;
  const cpc=clicks>0?spend/clicks:0;
  const hookRate=impressions>0?video3s/impressions*100:0;
  const holdRate=video3s>0?video15s/video3s*100:0;
  const cps=seguidores>0?spend/seguidores:0;
  return {spend,clicks,impressions,video3s,video15s,profileVisits,seguidores,ctr,cpm,cpc,hookRate,holdRate,cps};
}

function renderAquecResumo(){
  const el=document.getElementById("page-resumo"); if(!el)return;
  const _resumoFocus=document.activeElement?.id;
  const today=todayISO(), yest=yesterdayISO();
  const start=S.startDate||today, end=S.endDate||today;

  function fD(v){ return "$"+v.toFixed(2).replace(".",","); }
  function fP(v){ return v.toFixed(2).replace(".",",")+"%"; }
  function fN(v){ return v===0?"0":v.toLocaleString("pt-BR"); }
  function fDM(iso){ if(!iso)return "—"; const [,m,d]=iso.split("-"); return `${d}/${m}`; }

  function em(val, meta){
    if(!val||val===0||!meta||!meta.val) return "";
    const ratio=meta.higher?val/meta.val:meta.val/val;
    if(ratio>=1)   return "🟢";
    if(ratio>=0.85)return "🟡";
    return "🔴";
  }

  function aquecMetrics(s, e){
    const aD=S.aquecMeta||{};
    let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
    for(const [d,v] of Object.entries(aD)){
      if(d<s||d>e) continue;
      spend+=v.spend;clicks+=v.clicks;impressions+=v.impressions;
      video3s+=v.video3s;video15s+=v.video15s;profileVisits+=v.profileVisits;
    }
    const asD=S.aquecSeg||{};
    let seguidores=0;
    for(const [d,v] of Object.entries(asD)){
      if(d<s||d>e) continue;
      seguidores+=v.seguidores;
    }
    const cpm=impressions>0?spend/impressions*1000:null;
    const hookRate=impressions>0?video3s/impressions*100:null;
    const holdRate=video3s>0?video15s/video3s*100:null;
    const cpVisita=profileVisits>0?spend/profileVisits:null;
    const cpSeg=seguidores>0?spend/seguidores:null;
    const txConv=profileVisits>0?seguidores/profileVisits*100:null;
    return {spend,profileVisits,seguidores,cpm,hookRate,holdRate,cpVisita,cpSeg,txConv};
  }

  const tot  =aquecMetrics(start,end);
  const ontem=aquecMetrics(yest,yest);
  const hoje =aquecMetrics(today,today);
  const dateLabel=start===end?fDM(start):`${fDM(start)} a ${fDM(end)}`;

  function textBlock(label, m){
    function line(lbl, val, fmtFn, meta, pad=42){
      const v=val===null?"#DIV/0!":fmtFn(val);
      const dot=meta&&meta.val?(val===null?"":"\t"+(em(val,meta)||"🔴")+" Meta: "+meta.label):"";
      return `${lbl.padEnd(pad," ")}${v}${dot}`;
    }
    return [
      `📶 *${label}*`,``,
      line("Investimento:",              m.spend,       fD, null),
      line("Visitas ao Perfil:",         m.profileVisits,fN, null),
      line("Custo por visita ao perfil:",m.cpVisita,    fD, null),
      line("Seguidores:",                m.seguidores,  fN, null),
      line("Custo por Seguidor:",        m.cpSeg,       fD, null),``,
      line("Tx de conversao de seguidores:",m.txConv,  fP, METAS_AQUEC.txConv),
      line("hook rate (viu 3s / impressões):",m.hookRate,fP,METAS_AQUEC.hookRate),
      line("hold rate (viu 15s / viu 3s):",  m.holdRate, fP,METAS_AQUEC.holdRate),``,
      line("CPM:",                       m.cpm,         fD, METAS_AQUEC.cpm),
    ].join("\n");
  }

  const fullText=[
    `*Finanzas con proposito - aquecimento base*`,``,
    `_${dateLabel}_`,``,
    textBlock("Total", tot),``,``,
    textBlock("Ontem",ontem),``,``,
    textBlock("Hoje",hoje),
  ].join("\n");

  function row(lbl, val, fmtFn, meta){
    const fv=val===null?"—":(typeof val==="number"?fmtFn(val):val);
    const badge=meta&&meta.val?em(val,meta):"";
    const metaTxt=meta&&meta.val&&val!==null?`<span style="font-size:10px;color:var(--hint);margin-left:4px">meta ${meta.label}</span>`:"";
    return `<div style="display:grid;grid-template-columns:200px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong)">${fv}</span>
      <span style="font-size:13px;min-width:28px;text-align:right">${badge}${metaTxt}</span>
    </div>`;
  }

  function section(label, m, isHoje=false){
    const planRow=isHoje?`
      <div style="display:grid;grid-template-columns:200px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
        <span style="color:var(--muted);font-size:12px">Plan até hj</span>
        <input id="aquec-plan-input"
          value="${S.aquecPlanHoje||''}"
          placeholder="Digitar plan..."
          oninput="S.aquecPlanHoje=this.value;renderAquecResumo()"
          style="background:var(--surf);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:3px 8px;outline:none;width:100%">
      </div>`:"";
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">${label}</div>
      ${row("Investimento", m.spend, fD, null)}
      ${row("Visitas ao Perfil", m.profileVisits, fN, null)}
      ${row("Custo/Visita", m.cpVisita, fD, null)}
      ${row("Seguidores", m.seguidores, fN, null)}
      ${row("Custo/Seguidor", m.cpSeg, fD, null)}
      <div style="height:8px"></div>
      ${row("Tx conv. seguidores", m.txConv, fP, METAS_AQUEC.txConv)}
      ${row("Hook Rate (3s/impr.)", m.hookRate, fP, METAS_AQUEC.hookRate)}
      ${row("Hold Rate (15s/3s)", m.holdRate, fP, METAS_AQUEC.holdRate)}
      <div style="height:8px"></div>
      ${row("CPM", m.cpm, fD, METAS_AQUEC.cpm)}
      ${planRow}
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:16px">
      <div>
        <div class="hdr-title">Resumo diário — Aquecimento Base</div>
        <div class="hdr-sub">período: ${dateLabel} · ontem: ${fDM(yest)} · hoje: ${fDM(today)}</div>
      </div>
      <button id="aquec-copy-btn" onclick="aquecCopyResumo()"
        style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.3);border-radius:8px;color:#93c5fd;font-size:12px;font-weight:600;cursor:pointer">
        📋 Copiar resumo
      </button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start">
      <div>
        ${section("Total", tot, false)}
        ${section("Ontem", ontem, false)}
        ${section("Hoje", hoje, true)}
      </div>
      <div style="position:sticky;top:20px">
        <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px">
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">Preview</div>
          <pre id="aquec-resumo-pre" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.6;margin:0">${fullText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
        </div>
      </div>
    </div>
    <p class="foot">Ontem e Hoje são sempre datas fixas · Total reflete o filtro de datas do header</p>
  `;

  document.getElementById("aquec-resumo-pre")._text=fullText;

  if(_resumoFocus==="aquec-plan-input"){
    requestAnimationFrame(()=>{
      const inp=document.getElementById("aquec-plan-input");
      if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
    });
  }
}

function aquecCopyResumo(){
  const pre=document.getElementById("aquec-resumo-pre");
  if(!pre) return;
  const txt=pre._text||pre.textContent;
  navigator.clipboard.writeText(txt).then(()=>{
    const btn=document.getElementById("aquec-copy-btn");
    if(btn){const o=btn.textContent;btn.textContent="✓ Copiado!";setTimeout(()=>btn.textContent=o,2000);}
  });
}

</script>
</body>
</html>
