<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Finanzas - Reto 14 Dias — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--card:#121826;--border:rgba(255,255,255,.07);--border-h:rgba(255,255,255,.12);
  --text:#e8edf6;--text-strong:#f1f5fb;--muted:#8a96ab;--hint:#6b7689;
  --accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
  --green:#34d399;--amber:#fbbf24;--red:#f87171;
  --surf:rgba(255,255,255,.03);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ─── App Header ─────────────────────────────────────────────────── */
.app-hdr{position:sticky;top:0;z-index:20;background:rgba(12,17,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:0 26px;height:54px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}

/* Funil dropdown */
.funil-wrap{position:relative}
.funil-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surf);cursor:pointer;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;transition:border-color .15s}
.funil-btn:hover{border-color:var(--border-h)}
.funil-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.funil-name{font-size:12px;font-weight:600;color:var(--text-strong)}
.funil-status{font-size:9px;color:var(--green);letter-spacing:.04em}
.funil-chevron{color:var(--muted);font-size:10px;margin-left:2px}
.funil-menu{position:absolute;top:calc(100% + 6px);left:0;background:#1a2236;border:1px solid var(--border-h);border-radius:10px;padding:4px;min-width:180px;box-shadow:0 6px 30px rgba(2,6,20,.45);z-index:100}
.funil-opt{padding:8px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:all .12s;display:flex;align-items:center;gap:8px}
.funil-opt:hover{background:var(--accent-bg);color:var(--text)}
.funil-opt.fopt-active{background:var(--accent-bg);color:#cfe0ff}
.fopt-dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.funil-opt.fopt-active .fopt-dot{background:var(--green)}

/* Nav tabs */
.hdr-tabs{display:flex;align-items:center;gap:4px}
.htab{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;white-space:nowrap}
.htab:hover{color:var(--text)}
.htab.htab-active{background:rgba(59,130,246,.16);color:#fff}
.htab-icon{font-size:13px}

/* Period controls */
.hdr-right{display:flex;align-items:center;gap:8px}
.presets{display:flex;gap:4px}
.btn-pre{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 11px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .12s;white-space:nowrap}
.btn-pre:hover{border-color:var(--border-h);color:var(--text)}
.btn-pre.on{background:rgba(59,130,246,.16);border-color:rgba(96,165,250,.35);color:#cfe0ff;font-weight:600}
.drbox{display:flex;align-items:center;background:var(--surf);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .15s;padding:0 6px;gap:3px}
.drbox:focus-within{border-color:rgba(96,165,250,.5)}
.drbox-icon{color:var(--hint);font-size:12px;user-select:none}
.drbox input[type=date]{background:transparent;border:none;outline:none;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;padding:5px 4px;cursor:pointer;color-scheme:dark;width:100px}
.drbox-sep{color:var(--hint);font-size:11px;user-select:none}
.btn-update{background:rgba(59,130,246,.16);border:1px solid rgba(96,165,250,.3);color:#60a5fa;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .15s;white-space:nowrap;box-shadow:0 0 16px rgba(59,130,246,.2)}
.btn-update:hover:not(:disabled){box-shadow:0 0 16px rgba(59,130,246,.4)}
.btn-update:disabled{opacity:.4;cursor:not-allowed}

/* ─── Content ────────────────────────────────────────────────────── */
.app-content{max-width:1640px;margin:0 auto;padding:22px 30px 40px}
.page{display:none}.page.active{display:block}

/* Page header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.hdr-title{font-size:22px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text-strong);line-height:1.25}
.hdr-sub{margin-top:5px;font-size:11px;color:var(--hint);font-family:'JetBrains Mono',monospace}
.err{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--red);line-height:1.5}

/* KPIs */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.kc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.kc:hover{border-color:var(--border-h)}
.kc-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.kc-val{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.02em;font-size:22px;line-height:1.1;color:var(--text-strong)}
.kc-val-sm{font-size:18px}
.kc-sub{font-size:10px;color:var(--hint);margin-top:5px;font-family:'JetBrains Mono',monospace}
.kc-date{font-size:9px;color:var(--hint);margin-bottom:4px;font-family:'JetBrains Mono',monospace;font-weight:500}

/* Section label */
.section-lbl{font-size:9px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:20px}

/* Status legend */
.status-legend{display:flex;gap:16px;margin-bottom:14px}
.sl{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--hint)}
.sl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Charts */
.cc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px 14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ct{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.lg{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ll{width:14px;height:2px;border-radius:2px}
.ld{width:7px;height:7px;border-radius:50%}
.charts-2x2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}
.charts-2x3{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}

/* Toggle overlay buttons */
.overlay-btns{display:flex;gap:6px}
.btn-overlay{font-size:10px;padding:3px 10px;border-radius:5px;border:1px solid var(--border-h);color:var(--muted);background:transparent;cursor:pointer;transition:all .12s;font-family:'DM Sans',sans-serif}
.btn-overlay:hover{border-color:var(--accent);color:var(--text)}
.btn-overlay.on{background:var(--accent-bg);border-color:rgba(96,165,250,.4);color:#60a5fa;font-weight:600}

/* Tooltip */
.tip{background:#1a2236;border:1px solid var(--border-h);border-radius:8px;padding:10px 13px;font-size:12px;box-shadow:0 4px 16px rgba(2,6,20,.45);display:none;position:absolute;pointer-events:none;z-index:20;min-width:150px}
.tl{color:var(--hint);margin-bottom:5px;font-weight:500;font-size:10px;font-family:'JetBrains Mono',monospace}
.tr{display:flex;justify-content:space-between;gap:14px;margin-bottom:2px;font-size:11px}
.tv{color:var(--text-strong);font-weight:600;font-family:'JetBrains Mono',monospace}

/* Spinner */
.sw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.sp{width:32px;height:32px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{color:var(--hint);font-size:13px}
.foot{margin-top:18px;font-size:10px;color:var(--hint);text-align:center;font-family:'JetBrains Mono',monospace;opacity:.5}
canvas{display:block}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer;filter:invert(1)}

/* Quick period inside pages (funil / análise) */
.period-wrap{margin-bottom:18px}
.period-top{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.period-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.drbox-sm{display:flex;align-items:center;background:var(--surf);border:1px solid var(--border);border-radius:7px;overflow:hidden;gap:2px;padding:0 5px}
.drbox-sm input[type=date]{background:transparent;border:none;outline:none;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;padding:4px 4px;cursor:pointer;color-scheme:dark;width:96px}
.period-quick{display:flex;gap:5px;flex-wrap:wrap}
.btn-q{background:transparent;border:1px solid var(--border);color:var(--hint);padding:4px 11px;border-radius:6px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;transition:all .12s;white-space:nowrap}
.btn-q:hover{border-color:var(--border-h);color:var(--text)}
.btn-q.on{background:var(--accent-bg);border-color:rgba(96,165,250,.35);color:#cfe0ff;font-weight:600}

/* Análise sub-tabs */
.ana-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;gap:0}
.ana-tab{padding:7px 14px;font-size:11px;font-weight:500;color:var(--hint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.ana-tab:hover{color:var(--text)}
.ana-tab.active{color:#60a5fa;border-bottom-color:#3b82f6}

/* ─── Mobile Responsive ────────────────────────────────────────── */
@media(max-width:768px){
  /* ── Header ── */
  .app-hdr{
    height:auto;flex-wrap:wrap;
    padding:0;gap:0;align-items:stretch;
  }
  .funil-wrap{
    padding:9px 14px;flex-shrink:0;
    border-bottom:1px solid var(--border);
    width:auto;
  }
  .hdr-right{
    order:2;flex:1;min-width:0;
    display:flex;align-items:center;gap:6px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    padding:8px 14px 8px 8px;flex-wrap:nowrap;
    border-bottom:1px solid var(--border);
  }
  .hdr-right::-webkit-scrollbar{display:none}
  .presets{flex-wrap:nowrap;gap:3px}
  .btn-pre{font-size:10px;padding:4px 8px;flex-shrink:0}
  .drbox{flex-shrink:0}
  .drbox input[type=date]{width:86px;font-size:10px}
  .btn-update{font-size:11px;padding:5px 10px;flex-shrink:0}
  .hdr-tabs{
    order:3;width:100%;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    flex-wrap:nowrap;gap:2px;
    padding:6px 14px 8px;
  }
  .hdr-tabs::-webkit-scrollbar{display:none}
  .htab{flex-shrink:0;font-size:11px;padding:5px 10px}
  .htab-icon{font-size:12px}

  /* ── Content ── */
  .app-content{padding:14px 10px 30px;max-width:100%}
  .hdr{flex-direction:column;gap:6px;margin-bottom:14px}
  .hdr-title{font-size:18px}

  /* ── KPI Grids ── */
  .g3,.g4,.g5{
    grid-template-columns:repeat(2,1fr)!important;
    gap:8px!important;
  }
  .kc{padding:12px 13px}
  .kc-val{font-size:18px}
  .kc-val-sm{font-size:15px}

  /* ── Inline repeat grids (render functions) ── */
  [style*="repeat(3,1fr)"],[style*="repeat(4,1fr)"],
  [style*="repeat(5,1fr)"],[style*="repeat(6,1fr)"],
  [style*="repeat(7,1fr)"],[style*="repeat(8,1fr)"]{
    grid-template-columns:repeat(2,1fr)!important;
    gap:8px!important;
  }
  /* 2-column side-by-side layouts → single column */
  [style*="1fr 1fr"]{grid-template-columns:1fr!important}
  /* Funil SVG + cards sidebar → stack */
  [style*="1fr 260px"]{grid-template-columns:1fr!important}
  /* Resumo diário 2-col → stack */
  [style*="220px 1fr"]{grid-template-columns:1fr!important}

  /* ── Charts ── */
  .charts-2x2,.charts-2x3{
    grid-template-columns:1fr!important;
    gap:10px!important;
  }

  /* ── Tables: allow horizontal scroll ── */
  .page div[style*="overflow:hidden"]{
    overflow-x:auto!important;
    -webkit-overflow-scrolling:touch;
  }
  .page table{font-size:10px!important}
  .page td,.page th{
    padding:7px 8px!important;
    white-space:nowrap;
  }
  /* First column (names/labels) can wrap */
  .page td:first-child,.page th:first-child{
    white-space:normal;
    min-width:90px;max-width:140px;
  }

  /* ── Status legend ── */
  .status-legend{flex-wrap:wrap;gap:8px}

  /* ── Period quick buttons ── */
  .period-quick{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .period-quick::-webkit-scrollbar{display:none}
  .btn-q{flex-shrink:0;font-size:10px;padding:3px 9px}

  /* ── Ana sub-tabs ── */
  .ana-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap}
  .ana-tabs::-webkit-scrollbar{display:none}
  .ana-tab{flex-shrink:0;font-size:10px;padding:6px 10px}

  /* ── Section label spacing ── */
  .section-lbl{margin-top:16px}
}
</style>
</head>
<body>
<!-- ─── App Header ───────────────────────────────────────────────── -->
<header class="app-hdr">
  <!-- Left: funil selector -->
  <div class="funil-wrap" id="funil-wrap">
    <button class="funil-btn" id="funil-btn" onclick="toggleFunilMenu(event)">
      <span class="funil-dot" id="funil-dot"></span>
      <div>
        <div class="funil-name" id="funil-name">Finanzas - Reto 14 Dias</div>
        <div class="funil-status" id="funil-status">ativo</div>
      </div>
      <span class="funil-chevron">▾</span>
    </button>
    <div class="funil-menu" id="funil-menu" style="display:none">
      <div class="funil-opt fopt-active" id="fopt-reto" onclick="selectFunil('reto')"><span class="fopt-dot"></span>Finanzas - Reto 14 Dias</div>
      <div class="funil-opt" id="fopt-dist" onclick="selectFunil('dist')"><span class="fopt-dot"></span>Finanzas - Distribuição conteúdo</div>
      <div class="funil-opt" id="fopt-aquec" onclick="selectFunil('aquec')"><span class="fopt-dot"></span>Finanzas - Aquecimento Base</div>
      <div class="funil-opt" id="fopt-feo" onclick="selectFunil('feo')"><span class="fopt-dot"></span>Finanzas - FEO</div>
    </div>
  </div>

  <!-- Center: navigation tabs -->
  <nav class="hdr-tabs" id="hdr-tabs">
    <button class="htab htab-active" id="htab-principal" onclick="navTo('principal')"><span class="htab-icon">⊞</span>Principal</button>
    <button class="htab" id="htab-trafego" onclick="navTo('trafego')"><span class="htab-icon">⟳</span>Métricas tráfego</button>
    <button class="htab" id="htab-funil" onclick="navTo('funil')"><span class="htab-icon">▽</span>Métricas do funil</button>
    <button class="htab" id="htab-anuncios" onclick="navTo('anuncios')"><span class="htab-icon">◈</span>Anúncios</button>
  </nav>

  <!-- Right: period + refresh -->
  <div class="hdr-right">
    <div class="presets" id="hdr-presets">
      <button class="btn-pre" id="hpre-hoje" onclick="applyQuickCurrent('hoje')">Hoje</button>
      <button class="btn-pre" id="hpre-ontem" onclick="applyQuickCurrent('ontem')">Ontem</button>
      <button class="btn-pre" id="hpre-7d" onclick="applyQuickCurrent('7d')">7 dias</button>
      <button class="btn-pre on" id="hpre-30d" onclick="applyQuickCurrent('30d')">30 dias</button>
      <button class="btn-pre" id="hpre-mes" onclick="applyQuickCurrent('mes')">Este mês</button>
    </div>
    <div class="drbox">
      <span class="drbox-icon">📅</span>
      <input type="date" id="hdr-start" onchange="onDCCurrent('s',this.value)"/>
      <span class="drbox-sep">→</span>
      <input type="date" id="hdr-end" onchange="onDCCurrent('e',this.value)"/>
    </div>
    <button class="btn-update" id="btn-update" onclick="loadData(true)">↻ Atualizar</button>
  </div>
</header>

<!-- ─── Content ──────────────────────────────────────────────────── -->
<div class="app-content">
  <div class="sw" id="loading"><div class="sp"></div><p class="st">Carregando dados...</p></div>
  <div id="err-panel" style="display:none;align-items:flex-start;justify-content:center;padding:40px 24px"></div>
  <div id="page-principal"       class="page active"></div>
  <div id="page-funil"           class="page"></div>
  <div id="page-trafego"         class="page"></div>
  <div id="page-anuncios"        class="page"></div>
  <div id="page-resumo"          class="page"></div>
</div>

function extractCountryFromAdset(adsetName){

// Extrai Ad ID numérico de 15-20 dígitos de uma string que pode ser:

  if(!raw) return null;
  // já é um número puro
  if(/^\d{15,20}$/.test(raw.trim())) return raw.trim();
  // busca sequência de 15-20 dígitos
  const m=raw.match(/\d{15,20}/);

}


// ── Hotmart helpers ─────────────────────────────────────────────────────────
// Converte timestamp (ms) ou "dd/mm/yyyy HH:MM:SS" para YYYY-MM-DD (GMT-6 México)
function tsToISO(ts){
  if(!ts||ts==="0") return null;
  // Formato textual: dd/mm/yyyy HH:MM:SS ou dd/mm/yyyy
  const txtMatch=String(ts).match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+\d{2}:\d{2}:\d{2})?$/);
  if(txtMatch){
    const [,dd,mm,yyyy]=txtMatch;
    return `${yyyy}-${mm}-${dd}`;
  }
  // Timestamp em milissegundos
  const n=parseInt(ts);
  if(!n||isNaN(n)) return null;
  const d=new Date(n-3*60*60*1000);
  return d.toISOString().split("T")[0];
}

// Extrai Ad ID de 15-20 dígitos do xcod da Hotmart
// Formato: [prefix]hQwK21wXxR[campaign|id]hQwK21wXxR[adset|id]hQwK21wXxR[adName|adId]hQwK21wXxR[placement]
function extractXcodMeta(xcod){
  const SEP="hQwK21wXxR";
  if(!xcod||!xcod.startsWith("FB")) return {platform:"",placement:""};
  const parts=xcod.slice(2).split(SEP);
  if(parts.length<2) return {platform:"",placement:""};
  const placement=parts[parts.length-1]||"";
  const p=placement.toLowerCase();
  let platform="";
  if(p.includes("instagram")) platform="instagram";
  else if(p.includes("facebook")) platform="facebook";
  else if(p.includes("messenger")) platform="messenger";
  else if(p.includes("audience")) platform="audience_network";
  else if(p.includes("thread")) platform="threads";
  else if(placement&&!placement.includes("{{")) platform=placement;
  return {platform,placement};
}
function extractAdIdFromXcod(xcod){
  if(!xcod) return null;
  const SEP="hQwK21wXxR";
  const parts=xcod.split(SEP);
  if(parts.length>=4){
    const adPart=parts[3];
    const pipe=adPart.lastIndexOf("|");
    if(pipe>=0){
      const candidate=adPart.slice(pipe+1).trim();
      if(/^\d{15,20}$/.test(candidate)) return candidate;
    }
  }
  return extractAdId(xcod);
}

// Normaliza status Hotmart → texto interno
function normalizeHotmartStatus(s){
  if(!s) return "";
  const m={
    "APPROVED":"Paga","COMPLETE":"Paga","COMPLETED":"Paga",
    "REFUNDED":"Reembolsado","CANCELLED":"Reembolsado","CANCELED":"Reembolsado","CHARGEBACK":"Reembolsado",
    "BILLET_PRINTED":"Aberta","WAITING_PAYMENT":"Aberta","PRINTED":"Aberta",
    "OVERDUE":"Expirado","DELAYED":"Expirado","EXPIRED":"Expirado",
  };
  return m[String(s).toUpperCase().trim()]||String(s).trim();
}

// Conversão para USD — rates = quanto da moeda vale 1 USD
const FX_RATES={
  USD:1, MXN:18, BRL:5.50, EUR:0.92, GBP:0.79, CAD:1.37,
  ARS:1000, COP:4100, CLP:960, PEN:3.75, CRC:530, GTQ:7.8,
  HNL:25, NIO:36.5, DOP:60, BOB:6.9, PYG:7700, UYU:41,
};
function toUSD(valor, currency){
  const c=(currency||"USD").toUpperCase().trim();
  const rate=FX_RATES[c]||1;
  return valor/rate;
}

// Conversão de preço Hotmart → USD com regra por produto
// Reto: MXN÷18, USD÷1, outros→$38 fixo
// Cero/outros: usa FX_RATES padrão
function hotmartPriceUSD(priceRaw, currency, productName){
  const price=parseFloat(String(priceRaw).replace(",","."))||0;
  const curr=(currency||"USD").toUpperCase().trim();
  if(/reto/i.test(productName)){
    if(curr==="MXN") return price/18;
    if(curr==="USD") return price;
    return 38; // outras moedas: preço padrão Reto = $38
  }
  if(/mapa/i.test(productName)){
    if(curr==="MXN") return price/18;
    if(curr==="USD") return price;
    return 297; // outras moedas: preço padrão Mapa = $297
  }
  return toUSD(price, curr);
}

// Parseia aba Hotmart para linhas normalizadas (valores convertidos para USD)
function parseHotmartRows(sheetJ){
  return parseSheet(sheetJ).map(r=>{
    const ts=r["data.purchase.order_date"]||r["data.purchase.approved_date"]||"0";
    const d=tsToISO(ts);
    const st=normalizeHotmartStatus(r["data.purchase.status"]||"");
    const xcod=r["data.purchase.origin.xcod"]||"";
    const adId=extractAdIdFromXcod(xcod)||"";
    const {platform:_plat,placement:_plac}=extractXcodMeta(xcod);
    const priceRaw=String(r["data.purchase.price.value"]||"0").replace(",",".");
    const currency=r["data.purchase.price.currency_value"]||"USD";
    const productName=r["data.product.name"]||"";
    const valor=hotmartPriceUSD(priceRaw, currency, productName);
    // Hotmart às vezes descoloca campos: email vai parar em last_name quando não há sobrenome.
    // Detecta: se email não tem "@" mas last_name tem, usa last_name como email.
    const rawEmail=(r["data.buyer.email"]||"").trim();
    const rawLastName=(r["data.buyer.last_name"]||"").trim();
    const resolvedEmail=(rawEmail.includes("@")?rawEmail:(rawLastName.includes("@")?rawLastName:"")).toLowerCase();
    // Telefone: checkout_phone ou, se email era na verdade um número, usa rawEmail como tel
    const rawPhone=(r["data.buyer.checkout_phone"]||"").replace(/\D/g,"");
    const resolvedPhone=rawPhone||((!rawEmail.includes("@")&&/^\d{7,}$/.test(rawEmail))?rawEmail.replace(/\D/g,""):"");
    return {
      "Email":resolvedEmail,
      "CPF Comprador":"",
      "Telefone":resolvedPhone,
      "Nome":r["data.buyer.name"]||"",
      "Status da compra":st,
      "Data da compra":d||"",
      "Nome do produto":r["data.product.name"]||"",
      "Valor do produto":valor.toFixed(2),
      "Taxa da plataforma":"0",
      "Ad Id":adId,
      _src:"hotmart",
      platform:_plat,
      placement:_plac,
      _orderDate:r["data.purchase.order_date"]||"",
    };
  }).filter(r=>r["Data da compra"])
    // Dedup por order_date: mesma compra pode gerar 2 webhooks; prefere o que tem email real
    .reduce((acc,r)=>{
      const key=r._orderDate||r["Data da compra"];
      const i=acc.findIndex(x=>(x._orderDate||x["Data da compra"])===key);
      if(i<0){ acc.push(r); }
      else{
        const hasEmail=r["Email"]&&r["Email"].includes("@");
        const existingEmail=acc[i]["Email"]&&acc[i]["Email"].includes("@");
        if(!existingEmail&&hasEmail) acc[i]=r; // substitui pela linha com email real
      }
      return acc;
    },[]);
}

// ── Load data ──────────────────────────────────────────────────────────────
// Busca uma aba em blocos de 5000 linhas para evitar timeout em abas grandes
// ── CSV parser → mesmo formato que a Sheets API {values:[rows]} ───────────
function parseCSVText(text){
  const lines=text.split(/\r?\n/);
  const result=[];
  for(const line of lines){
    if(!line.trim()) continue;
    const row=[];let cur="";let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){
        if(inQ&&line[i+1]==='"'){cur+='"';i++;}
        else inQ=!inQ;
      } else if(c===','&&!inQ){row.push(cur);cur="";}
      else cur+=c;
    }
    row.push(cur);
    result.push(row);
  }
  return {values:result};
}

async function fetchCSV(filename){
  console.log(`[csv] carregando "${filename}"...`);
  const res=await fetch("./"+encodeURIComponent(filename));
  if(!res.ok) throw new Error(`HTTP ${res.status} ao carregar "${filename}"`);
  const text=await res.text();
  const j=parseCSVText(text);
  console.log(`[csv] "${filename}": ${j.values.length-1} linhas de dados`);
  return j;
}

async function fetchCSVSafe(filename){
  return fetchCSV(filename).catch(e=>{
    console.warn(`[csv] "${filename}" não encontrado:`,e.message);
    return {values:[]};
  });
}

// ── Sheets API helpers ──────────────────────────────────────────────────────
async function fetchSheetPaged(tab, lastCol="L", pageSize=5000, sheetId=SHEET_ID){
  const allValues=[];
  let startRow=1;
  while(true){
    const endRow=startRow+pageSize-1;
    const range=`${encodeURIComponent(tab)}!A${startRow}:${lastCol}${endRow}`;
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}?key=${GAPI_KEY}`;
    const res=await fetch(url);
    if(!res.ok) throw new Error(`Sheets API: HTTP ${res.status} ao buscar aba "${tab}"`);
    const data=await res.json();
    const rows=data.values||[];
    allValues.push(...rows);
    if(rows.length<pageSize) break;
    startRow+=pageSize;
  }
  return {values:allValues};
}

      }
    }
        S.distMetaByCamp=dByCamp; S.distMetaByCampByDate=dByCampByDate; S.distSeg=sD; S.distSegByAd=sByAd; S.distSegByCamp=sByCamp;
    // ── Aquecimento Base ──────────────────────────────────────────────────────
    const aD={}, aByAd={}, aByAdByDate={}, aByCamp={}, aByCampByDate={};

      if(!aD[d])aD[d]={spend:0,clicks:0,impressions:0,video3s:0,video15s:0,profileVisits:0};

        aByAd[adName].spend+=spendV; aByAd[adName].clicks+=clicksV; aByAd[adName].impressions+=impressV;
        aByAd[adName].video3s+=video3sV; aByAd[adName].video15s+=video15sV; aByAd[adName].profileVisits+=profVisV;
        if(!aByAdByDate[adName])aByAdByDate[adName]={};
        if(!aByAdByDate[adName][d])aByAdByDate[adName][d]={spend:0,clicks:0,impressions:0,video3s:0,video15s:0,profileVisits:0};
        aByAdByDate[adName][d].spend+=spendV; aByAdByDate[adName][d].clicks+=clicksV;
        aByAdByDate[adName][d].impressions+=impressV; aByAdByDate[adName][d].video3s+=video3sV;
        aByAdByDate[adName][d].video15s+=video15sV; aByAdByDate[adName][d].profileVisits+=profVisV;
      }
      if(campName){
        if(!aByCamp[campName])aByCamp[campName]={campName,spend:0,clicks:0,impressions:0,video3s:0,video15s:0,profileVisits:0,seguidores:0};
        aByCamp[campName].spend+=spendV; aByCamp[campName].clicks+=clicksV; aByCamp[campName].impressions+=impressV;
        aByCamp[campName].video3s+=video3sV; aByCamp[campName].video15s+=video15sV; aByCamp[campName].profileVisits+=profVisV;
        if(!aByCampByDate[campName])aByCampByDate[campName]={};
        if(!aByCampByDate[campName][d])aByCampByDate[campName][d]={spend:0,clicks:0,impressions:0,video3s:0,video15s:0,profileVisits:0};
        aByCampByDate[campName][d].spend+=spendV; aByCampByDate[campName][d].clicks+=clicksV;
        aByCampByDate[campName][d].impressions+=impressV; aByCampByDate[campName][d].video3s+=video3sV;

      }
    }
    // Seguidores aquec
    const asD={}, asByAd={}, asByCamp={};

      const parts=dRaw.split("/");
      const d=parts.length===3?`${parts[2]}-${parts[1].padStart(2,"0")}-${parts[0].padStart(2,"0")}`:"";
      if(!d)continue;

      const visV =parseInt(r["Visitas ao perfil do Instagram"]||0)||0;
      const adName  =(r["Nome do anúncio"]||"").trim();
      const campName=(r["Nome da campanha"]||"").trim();
      if(!asD[d])asD[d]={seguidores:0,profileVisits:0};
      asD[d].seguidores+=segV; asD[d].profileVisits+=visV;
      if(adName){
        if(!asByAd[adName])asByAd[adName]={seguidores:0,profileVisits:0};
        asByAd[adName].seguidores+=segV; asByAd[adName].profileVisits+=visV;

      if(campName){

    // ── FEO ────────────────────────────────────────────────────────────────

    const [feoMetaJ, feoVendasJ] = await Promise.all([

    {
      const fmD={}, fmByAd={}, fmByAdByDate={}, fmByCamp={}, fmByCampByDate={}, fmByAdId={};

      for(const r of parseSheet(feoMetaJ)){

        const spendV=_acc==="Conta 2 cartão"?_raw/18:_raw;
        const clicksV   =parseInt(r["Action Link Clicks"]||0)||0;
        const icV       =parseInt(r["Action Omni Initiated Checkout"]||r["Action FB Pixel Initiate Checkout (Offsite Conversion)"]||0)||0;
        const impressV  =parseInt(r["Impressions"]||0)||0;
        const lvV       =parseInt(r["Action Landing Page View"]||0)||0;
        const chkV      =parseInt(r["Action Omni Initiated Checkout"]||r["Action FB Pixel Initiate Checkout (Offsite Conversion)"]||0)||0;
        const purchV    =parseInt(r["Action Omni Purchase"]||0)||0;
        const video3sV  =parseInt(r["Action Video View"]||0)||0;
        const video15sV =parseInt(r["Video 15 Sec Watched Actions"]||0)||0;
        const adId      =(r["Ad ID"]||r["Ad Id"]||"").trim();
        const adName    =(r["Ad Name"]||"").trim();
        const adsetName =(r["Adset Name"]||"").trim();
        const campName  =(r["Campaign Name"]||"").trim();
        const igUrl     =r["Instagram Permalink URL"]||"";
        const adStatusR =(r["Ad Status"]||"").trim();
        const campStatusR=(r["Campaign Status"]||"").trim();
        const adsetStatusR=(r["Adset Status"]||"").trim();
        const advCode   =adName||adId;
        // daily totals
        if(!fmD[d])fmD[d]={spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0,purchases:0};
        fmD[d].spend+=spendV;fmD[d].clicks+=clicksV;fmD[d].impressions+=impressV;
        fmD[d].landingViews+=lvV;fmD[d].checkouts+=chkV;fmD[d].purchases+=purchV;
        // by temp
        const _t=extractTempFromCamp(campName);
        if(_t){
          if(!fmByTemp[_t][d])fmByTemp[_t][d]={spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0,purchases:0};
          const td=fmByTemp[_t][d];
          td.spend+=spendV;td.clicks+=clicksV;td.impressions+=impressV;
          td.landingViews+=lvV;td.checkouts+=chkV;td.purchases+=purchV;
        }
        // by ad
        if(advCode){
          if(!fmByAd[advCode])fmByAd[advCode]={advCode,adName,campName,igUrl,spend:0,clicks:0,impressions:0,ic:0,video3s:0,video15s:0,landingViews:0,checkouts:0,adIds:new Set(),dates:new Set()};
          fmByAd[advCode].spend+=spendV;fmByAd[advCode].clicks+=clicksV;fmByAd[advCode].impressions+=impressV;
          fmByAd[advCode].ic+=icV;
          fmByAd[advCode].video3s+=video3sV;fmByAd[advCode].video15s+=video15sV;
          fmByAd[advCode].landingViews+=lvV;fmByAd[advCode].checkouts+=chkV;
          if(adId)fmByAd[advCode].adIds.add(adId);
          fmByAd[advCode].dates.add(d);
          if(!fmByAdByDate[advCode])fmByAdByDate[advCode]={};
          if(!fmByAdByDate[advCode][d])fmByAdByDate[advCode][d]={spend:0,clicks:0,impressions:0,ic:0,video3s:0,video15s:0,landingViews:0,checkouts:0,adIds:new Set(),igUrl:""};
          const ab=fmByAdByDate[advCode][d];
          ab.spend+=spendV;ab.clicks+=clicksV;ab.impressions+=impressV;ab.ic+=icV;
          ab.video3s+=video3sV;ab.video15s+=video15sV;ab.landingViews+=lvV;ab.checkouts+=chkV;
          if(adId)ab.adIds.add(adId);
          if(igUrl&&!ab.igUrl)ab.igUrl=igUrl;
        }
        // by adId
        if(adId&&advCode){
          if(!fmByAdId[adId])fmByAdId[adId]={adId,advCode,campName,adStatus:"",campStatus:"",adsetStatus:"",lastStatusDate:"",byDate:{}};

          const ib=fmByAdId[adId].byDate[d];
          ib.spend+=spendV;ib.clicks+=clicksV;ib.impressions+=impressV;ib.ic+=icV;

          if(!fmByAdId[adId].lastStatusDate||d>fmByAdId[adId].lastStatusDate){
            fmByAdId[adId].adStatus=adStatusR;fmByAdId[adId].campStatus=campStatusR;
            fmByAdId[adId].adsetStatus=adsetStatusR;fmByAdId[adId].lastStatusDate=d;
          }
        }
        // by camp
        if(campName){
          if(!fmByCamp[campName])fmByCamp[campName]={campName,adIds:new Set(),spend:0,clicks:0,impressions:0,ic:0,landingViews:0,checkouts:0,campStatus:"",lastStatusDate:""};
          const cp=fmByCamp[campName];
          cp.spend+=spendV;cp.clicks+=clicksV;cp.impressions+=impressV;cp.ic+=icV;
          cp.landingViews+=lvV;cp.checkouts+=chkV;
          if(!cp.lastStatusDate||d>cp.lastStatusDate){cp.campStatus=campStatusR;cp.lastStatusDate=d;}
          if(adId)cp.adIds.add(adId);
          if(!fmByCampByDate[campName])fmByCampByDate[campName]={};
          if(!fmByCampByDate[campName][d])fmByCampByDate[campName][d]={spend:0,clicks:0,impressions:0,ic:0,landingViews:0,checkouts:0,adIds:new Set()};
          const cd=fmByCampByDate[campName][d];
          cd.spend+=spendV;cd.clicks+=clicksV;cd.impressions+=impressV;cd.ic+=icV;
          cd.landingViews+=lvV;cd.checkouts+=chkV;
          if(adId)cd.adIds.add(adId);
        }
      }
      S.feoMeta=fmD; S.feoMetaByAd=fmByAd; S.feoMetaByAdByDate=fmByAdByDate;
      S.feoMetaByAdId=fmByAdId; S.feoMetaByCamp=fmByCamp; S.feoMetaByCampByDate=fmByCampByDate;
      S.feoMetaByTemp=fmByTemp;

      // FEO vendas
      const feoRows=parseHotmartRows(feoVendasJ);
      const fvD={}, fvByAd={}, fvByAdDate={};
      const fvByTemp={frio:{},morno:{},quente:{}};
      for(const r of feoRows){
        if(r["Status da compra"]!=="Paga") continue;
        const d=r["Data da compra"];if(!d)continue;
        const valor=parseFloat(r["Valor do produto"])||0;
        if(!fvD[d])fvD[d]={qtd:0,valor:0,taxa:0};
        fvD[d].qtd+=1;fvD[d].valor+=valor;
        const adId=r["Ad Id"];
        if(adId){
          if(!fvByAd[adId])fvByAd[adId]={qtd:0,valor:0,taxa:0};
          fvByAd[adId].qtd+=1;fvByAd[adId].valor+=valor;
          if(!fvByAdDate[adId])fvByAdDate[adId]={};
          if(!fvByAdDate[adId][d])fvByAdDate[adId][d]={qtd:0,valor:0,taxa:0};
          fvByAdDate[adId][d].qtd+=1;fvByAdDate[adId][d].valor+=valor;
        }
      }
      // feoVendasByTemp via adId→campName→temp
      for(const [adId,byDate] of Object.entries(fvByAdDate)){
        const adData=fmByAdId[adId];if(!adData)continue;
        const temp=extractTempFromCamp(adData.campName);if(!temp)continue;
        for(const [d,vv] of Object.entries(byDate)){
          if(!fvByTemp[temp][d])fvByTemp[temp][d]={qtd:0,valor:0,taxa:0};
          fvByTemp[temp][d].qtd+=vv.qtd;fvByTemp[temp][d].valor+=vv.valor;
        }
      }
      S.feoVendas=fvD;S.feoVendasByAd=fvByAd;S.feoVendasByAdDate=fvByAdDate;
      S.feoVendasByTemp=fvByTemp;

      // FEO funil rows + by temp
      S.feoFunilRows=feoRows.map(r=>({...r,"Nome do produto":"FEO - Planilla Finanzas en Orden"}));
      {
        const fbuyerTemp={};
        for(const r of feoRows){
          if(r["Status da compra"]!=="Paga")continue;
          const adId=r["Ad Id"];if(!adId)continue;
          const adData=fmByAdId[adId];if(!adData)continue;
          const temp=extractTempFromCamp(adData.campName);if(!temp)continue;
          const em=(r["Email"]||"").toLowerCase().trim();
          if(em)fbuyerTemp["e:"+em]=temp;
        }
        const ffbt={frio:[],morno:[],quente:[]};
        for(const r of S.feoFunilRows){
          const em=(r["Email"]||"").toLowerCase().trim();
          const temp=fbuyerTemp["e:"+em];
          if(temp)ffbt[temp].push(r);
        }
        S.feoFunilRowsByTemp=ffbt;
      }
    }

    S.firstLoad=false;
  }catch(e){
    S.error="Erro ao processar dados: "+e.message;
    S.firstLoad=false;
    console.error("processing error:",e);
  }
  render();
}

// ── Derived — Principal ────────────────────────────────────────────────────
function getDaily(start,end){
  const d=D();
  const metaA=getMetaActive();
  const vA=getVendasActive();
  const all=new Set([...Object.keys(metaA),...Object.keys(vA)]);
  return Array.from(all).sort().filter(dt=>dt>=start&&dt<=end).map(date=>{
    const m=metaA[date]||{spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0,purchases:0};
    const v=vA[date]||{qtd:0,valor:0,taxa:0};
    const lucro=v.valor-v.taxa-(m.spend*TAXA_IMPOSTO);
    return{date,label:fDate(date),spend:m.spend,faturamento:v.valor,vendas:v.qtd,
      gerenciador:m.purchases||0,
      roas:m.spend>0?v.valor/m.spend:0,cpv:v.qtd>0?m.spend/v.qtd:0,
      ticket:v.qtd>0?v.valor/v.qtd:0,lucro};
  });
}
function getTotals(daily){
  const d=D();
  const vA=getVendasActive();
  const t=daily.reduce((a,dt)=>({spend:a.spend+dt.spend,fat:a.fat+dt.faturamento,vendas:a.vendas+dt.vendas,
    taxa:a.taxa+(vA[dt.date]?.taxa||0)}),{spend:0,fat:0,vendas:0,taxa:0});
  return{...t,faturamento:t.fat,
    roas:t.spend>0?t.fat/t.spend:0,cpv:t.vendas>0?t.spend/t.vendas:0,
    ticket:t.vendas>0?t.fat/t.vendas:0,lucro:t.fat-t.taxa-(t.spend*TAXA_IMPOSTO)};
}


// ── Derived — Tráfego ──────────────────────────────────────────────────────
function getDailyT(start,end){
  const d=D();
  const metaA=getMetaActive();
  const vA=getVendasActive();
  return Object.keys(metaA).sort().filter(dt=>dt>=start&&dt<=end).map(date=>{
    const m=metaA[date];
    const v=vA[date]||{qtd:0};
    const cpc   = m.clicks>0     ? m.spend/m.clicks          : 0;
    const ctr   = m.impressions>0 ? (m.clicks/m.impressions)*100 : 0;
    const cpm   = m.impressions>0 ? (m.spend/m.impressions)*1000 : 0;
    const txPagChk = m.landingViews>0 ? (m.checkouts/m.landingViews)*100 : 0;
    const txChkVnd = m.checkouts>0    ? (v.qtd/m.checkouts)*100           : 0;
    const connect  = m.clicks>0       ? (m.landingViews/m.clicks)*100     : 0;
    return{date,label:fDate(date),spend:m.spend,cpv:v.qtd>0?m.spend/v.qtd:0,
      cpc,ctr,cpm,txPagChk,txChkVnd,connect,
      clicks:m.clicks,impressions:m.impressions,landingViews:m.landingViews,
      checkouts:m.checkouts,vendas:v.qtd};
  });
}
function getTotalsT(daily){
  const t=daily.reduce((a,d)=>({spend:a.spend+d.spend,clicks:a.clicks+d.clicks,
    impressions:a.impressions+d.impressions,landingViews:a.landingViews+d.landingViews,
    checkouts:a.checkouts+d.checkouts,vendas:a.vendas+d.vendas}),
    {spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0,vendas:0});
  return{...t,
    cpv: t.vendas>0 ? t.spend/t.vendas : 0,
    cpc:   t.clicks>0       ? t.spend/t.clicks              : 0,
    ctr:   t.impressions>0  ? (t.clicks/t.impressions)*100  : 0,
    cpm:   t.impressions>0  ? (t.spend/t.impressions)*1000  : 0,
    txPagChk: t.landingViews>0 ? (t.checkouts/t.landingViews)*100 : 0,
    txChkVnd: t.checkouts>0    ? (t.vendas/t.checkouts)*100       : 0,
    connect:  t.clicks>0       ? (t.landingViews/t.clicks)*100    : 0,
  };
}

// Totais de um dia específico
function getDayMetrics(iso){
  const m=getMetaActive()[iso]||{spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0};
  const v=getVendasActive()[iso]||{qtd:0};
  return{
    spend:m.spend,
    cpc:   m.clicks>0       ? m.spend/m.clicks              : 0,
    ctr:   m.impressions>0  ? (m.clicks/m.impressions)*100  : 0,
    cpm:   m.impressions>0  ? (m.spend/m.impressions)*1000  : 0,
    txPagChk: m.landingViews>0 ? (m.checkouts/m.landingViews)*100 : 0,
    txChkVnd: m.checkouts>0    ? (v.qtd/m.checkouts)*100          : 0,
    connect:  m.clicks>0       ? (m.landingViews/m.clicks)*100    : 0,
    cpv:   v.qtd>0             ? m.spend/v.qtd                    : 0,
    vendas: v.qtd,
  };
}

  const distPages=["principal","anuncios","resumo"];

}

// ── Canvas drawing ─────────────────────────────────────────────────────────
const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)";
const TICK_C="#6b7689";

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");ctx.scale(DPR,DPR);
  return ctx;
}

function drawLineArea(ctx,xP,yP,vals,color,fill=true){
  if(vals.length<2)return;
  if(fill){
    const n=vals.length;
    ctx.beginPath();ctx.moveTo(xP(0),yP(vals[0]));
    for(let i=1;i<n;i++)ctx.lineTo(xP(i),yP(vals[i]));
    // find zero Y
    const yZero=yP(0);
    ctx.lineTo(xP(n-1),yZero);ctx.lineTo(xP(0),yZero);ctx.closePath();
    const cH=ctx.canvas.height/DPR;
    const g=ctx.createLinearGradient(0,0,0,cH);
    g.addColorStop(0,color+"28");g.addColorStop(1,color+"00");
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.moveTo(xP(0),yP(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(xP(i),yP(vals[i]));
  ctx.stroke();
}

// Gráfico simples (1 eixo, 1 linha) + overlay opcional nos 2 eixos Y
function drawChartWithOverlay(id, data, key, fmtY, refVal, refLabel, overlayInv, overlayCpv, cssW, cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:12,r:overlayInv||overlayCpv?52:12,b:26,l:52};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;

  const vals=data.map(d=>+(d[key])||0);
  const invVals=data.map(d=>d.spend||0);
  const cpvVals=data.map(d=>d.cpv||0);

  // Domínio eixo Y esquerda (métrica principal)
  let allL=[...vals];if(refVal!=null)allL.push(refVal);
  const lMax=Math.max(...allL,0.01)*1.2, lMin=0;
  // Domínio eixo Y direita (overlay)
  const rVals=overlayCpv?cpvVals:invVals;
  const rMax=overlayInv||overlayCpv?Math.max(...rVals,0.01)*1.2:1;

  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v-lMin)/(lMax-lMin))*cH;
  const yPR=v=>P.t+cH-((v-0)/(rMax-0))*cH;

  // Grid + eixo Y esquerda
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    const lv=lMax-(i/4)*(lMax-lMin);
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmtY(lv),P.l-4,y+3);
  }

  // Eixo Y direita se overlay ativo
  if(overlayInv||overlayCpv){
    const ovColor=overlayInv?CHART_INV:CHART_CPV;
    const ovFmt=overlayInv?fBRLShort:v=>"$"+v.toFixed(2);
    for(let i=0;i<=4;i++){
      const rv=rMax-(i/4)*(rMax-0);
      const y=P.t+(i/4)*cH;
      ctx.fillStyle=ovColor;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="left";
      ctx.fillText(ovFmt(rv),P.l+cW+4,y+3);
    }
  }

  // Linha de referência
  if(refVal!=null){
    const ry=yPL(refVal);
    ctx.strokeStyle=CHART_COLOR+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,ry);ctx.lineTo(P.l+cW,ry);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=CHART_COLOR;ctx.font="8px 'Inter',sans-serif";ctx.textAlign="right";
    ctx.fillText(refLabel||"Meta",P.l+cW,ry-3);
  }

  // Linha principal
  drawLineArea(ctx,xP,yPL,vals,CHART_COLOR,true);

  // Overlay
  if(overlayInv) drawLineArea(ctx,xP,yPR,invVals,CHART_INV,false);
  if(overlayCpv) drawLineArea(ctx,xP,yPR,cpvVals,CHART_CPV,false);

  // X labels
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Gráfico dual-axis (investimento x CPV)
function drawDual(id,data,cssW,cssH,metaCpv){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:52,b:28,l:58};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d.cpv||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,metaCpv||0,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v-0)/(lMax-0))*cH;
  const yPR=v=>P.t+cH-((v-0)/(rMax-0))*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("$"+(rMax-(i/4)*rMax).toFixed(0),P.l+cW+5,y+3.5);
  }
  if(metaCpv){
    const mY=yPR(metaCpv);
    ctx.strokeStyle=CHART_CPV+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=CHART_CPV;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta $"+metaCpv,P.l+cW+4,mY-3);
  }
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,CHART_CPV,false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Tooltip genérico
function setupTip(cid,tid,data,lines,padL=58,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${(l.fmt||fBRL)(+(d[l.key])||0)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}

// Gráfico de barras — vendas por dia
function drawBarVendas(id, data, cssW, cssH, showGap){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:24,r:showGap?50:16,b:26,l:36};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;
  const n=data.length; if(n===0)return;
  const vals=data.map(d=>d.vendas||0);
  const maxV=Math.max(...vals,1);

  // Compute GAP% per day
  const gapPcts=showGap?data.map(d=>{
    const h=d.vendas||0,g=d.gerenciador||0;
    return h>0?((g-h)/h)*100:0;
  }):[];

  // Horizontal grid (left scale = vendas count)
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const y=P.t+(i/ticks)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    if(i<ticks){
      ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="right";
      ctx.fillText(Math.round(maxV*(1-i/ticks)),P.l-4,y+3);
    }
  }

  // Green bars (Hotmart vendas)
  const slot=cW/n;
  const barW=Math.max(3,Math.min(28,slot*0.6));
  const GREEN="#34d399";
  for(let i=0;i<n;i++){
    const v=vals[i];
    const bh=Math.max(v>0?2:0,(v/maxV)*cH);
    const cx=P.l+slot*i+slot/2;
    const x=cx-barW/2;
    const yb=P.t+cH-bh;
    const g=ctx.createLinearGradient(0,yb,0,P.t+cH);
    g.addColorStop(0,GREEN+"dd");g.addColorStop(1,GREEN+"55");
    ctx.fillStyle=g;
    const r=Math.min(3,barW/2,bh/2);
    ctx.beginPath();
    ctx.moveTo(x+r,yb);ctx.lineTo(x+barW-r,yb);
    ctx.quadraticCurveTo(x+barW,yb,x+barW,yb+r);
    ctx.lineTo(x+barW,yb+bh);ctx.lineTo(x,yb+bh);ctx.lineTo(x,yb+r);
    ctx.quadraticCurveTo(x,yb,x+r,yb);ctx.closePath();
    ctx.fill();
    if(v>0){
      ctx.fillStyle="#e8edf6";
      ctx.font=`bold ${Math.max(8,Math.min(11,barW-1))}px 'DM Sans',sans-serif`;
      ctx.textAlign="center";
      ctx.fillText(v,cx,yb-4);
    }
  }

  // GAP% overlay — separate y-scale, no numbers on bars
  if(showGap&&gapPcts.length>0){
    const RED="#f87171";
    const maxGap=Math.max(Math.max(...gapPcts.map(Math.abs)),5);
    // Y mapping: 0% → mid chart; ±maxGap → top/bottom within 80% of chart height
    const gapY=pct=>P.t+cH*0.1+(1-((pct/maxGap)*0.8+1)/2)*cH*0.8;

    // Faint 0% reference line
    const y0=gapY(0);
    ctx.strokeStyle="rgba(248,113,113,0.25)";ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(P.l,y0);ctx.lineTo(P.l+cW,y0);ctx.stroke();
    ctx.setLineDash([]);

    // GAP% line
    ctx.strokeStyle=RED;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const cx=P.l+slot*i+slot/2;
      const gy=gapY(gapPcts[i]);
      if(i===0) ctx.moveTo(cx,gy); else ctx.lineTo(cx,gy);
    }
    ctx.stroke();ctx.setLineDash([]);

    // Dots (no per-point labels)
    for(let i=0;i<n;i++){
      const cx=P.l+slot*i+slot/2;
      const gy=gapY(gapPcts[i]);
      ctx.fillStyle=RED;
      ctx.beginPath();ctx.arc(cx,gy,2.5,0,Math.PI*2);ctx.fill();
    }
    // Fixed Y-scale on right margin: +max%, 0%, -max%
    const scaleTicks=[maxGap,0,-maxGap];
    ctx.font="bold 8px 'DM Sans',sans-serif";ctx.textAlign="left";
    for(const pct of scaleTicks){
      const gy=gapY(pct);
      ctx.fillStyle=pct===0?"rgba(248,113,113,0.5)":RED;
      const lbl=(pct>0?"+":"")+Math.round(pct)+"%";
      ctx.fillText(lbl,P.l+cW+4,gy+3);
    }
  }

  // X labels
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,P.l+slot*i+slot/2,P.t+cH+18);});
}

// Generic dual-axis (spend left, any metric right) for dist funil
function drawDistDual(id, data, rKey, rRef, rRefLabel, cssW, cssH){

  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,rRef||0.01,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-(v/lMax)*cH;
  const yPR=v=>P.t+cH-(v/rMax)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText(fBRLShort(rMax-(i/4)*rMax),P.l+cW+5,y+3.5);
  }
  if(rRef){
    const mY=yPR(rRef);
    ctx.strokeStyle="#f59e0b55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="#f59e0b";ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText(rRefLabel,P.l+cW+4,mY-3);
  }
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,"#f59e0b",false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Bar chart for dist data (seguidores or profile visits)
function drawDistBar(id, data, key, color, fmtFn, cssW, cssH){
  const ctx=initCanvas(id,cssW,cssH); if(!ctx)return;
  const P={t:22,r:16,b:26,l:32};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;
  const n=data.length; if(n===0)return;
  const vals=data.map(d=>d[key]||0);
  const maxV=Math.max(...vals,1);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
  }
  const slot=cW/n;
  const barW=Math.max(3,Math.min(28,slot*0.6));
  for(let i=0;i<n;i++){
    const v=vals[i];
    const cx=P.l+slot*i+slot/2;
    const bh=Math.max(v>0?2:0,(v/maxV)*cH);
    const x=cx-barW/2;
    const y=P.t+cH-bh;
    const g=ctx.createLinearGradient(0,y,0,P.t+cH);
    g.addColorStop(0,color+"dd");g.addColorStop(1,color+"44");
    ctx.fillStyle=g;
    const r=Math.min(3,barW/2,bh/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+barW-r,y);
    ctx.quadraticCurveTo(x+barW,y,x+barW,y+r);
    ctx.lineTo(x+barW,y+bh);ctx.lineTo(x,y+bh);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    ctx.fill();
    if(v>0){
      ctx.fillStyle="#e8edf6";
      ctx.font=`bold ${Math.max(8,Math.min(11,barW-1))}px 'DM Sans',sans-serif`;
      ctx.textAlign="center";ctx.fillText(fmtFn(v),cx,y-4);
    }
  }
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,P.l+slot*i+slot/2,P.t+cH+18);});
}

  const METRICS=[
    {key:"spend",    lbl:"Investimento",          fmt:fBRL,  meta:null,                              higher:null},
    {key:"cpv",      lbl:"Custo por Venda",        fmt:fBRL,  meta:isFeo?getFeoMetaCPV():META_CPV,   higher:false},
    {key:"cpc",      lbl:"CPC",                    fmt:fBRL,  meta:isFeo?null:METAS_T.cpc.val,       higher:false},
    {key:"ctr",      lbl:"CTR",                    fmt:fPct,  meta:isFeo?null:METAS_T.ctr.val,       higher:true},
    {key:"cpm",      lbl:"CPM",                    fmt:fBRL,  meta:isFeo?null:METAS_T.cpm.val,       higher:false},
    {key:"connect",  lbl:"Connect Rate",           fmt:fPct,  meta:isFeo?null:METAS_T.connect.val,   higher:true},
    {key:"txPagChk", lbl:"Tx Pág → Checkout",      fmt:fPct,  meta:isFeo?null:METAS_T.txPagChk.val, higher:true},
    {key:"txChkVnd", lbl:"Tx Checkout → Venda",    fmt:fPct,  meta:isFeo?null:METAS_T.txChkVnd.val, higher:true},
  ];

  // Formato da meta para o subtítulo — sempre no formato correto da métrica
  function metaSub(m){
    if(!m.meta) return "";
    return `Meta: ${m.fmt(m.meta)}`;
  }

  // Cards de uma linha de métricas a partir de um objeto com os valores
  function metricsRow(dataObj){
    return METRICS.map(m=>{
      const rawVal=dataObj[m.key]||0;
      const color=m.meta?statusColor(rawVal,m.meta,m.higher):"var(--text-strong)";

      return `<div class="kc" style="padding:12px 14px;border-color:${bord}">
        <div class="kc-lbl">${m.lbl}</div>
        <div class="kc-val" style="color:${color};font-size:17px">${m.fmt(rawVal)}</div>
        ${m.meta?`<div class="kc-sub">${metaSub(m)}</div>`:""}
      </div>`;
    }).join("");
  }

  function overlayBtn(key,which,label){
    const on=S.overlays[key][which];
    const color=which==="inv"?CHART_INV:CHART_CPV;
    return `<button class="btn-overlay${on?" on":""}"
      style="${on?`border-color:${color};color:${color};background:${color}18`:""}"

  // Gráficos em grade 2×3
  const CHART_CONFIGS=[

    {key:"cpc",      lbl:"CPC",                    fmt:fBRL, meta:isFeo?null:METAS_T.cpc.val,       metaLbl:isFeo?"":("Meta $0,24")},
    {key:"txPagChk", lbl:"Tx Pág → Checkout",      fmt:fPct, meta:isFeo?null:METAS_T.txPagChk.val, metaLbl:isFeo?"":("Meta 5,3%")},
    {key:"txChkVnd", lbl:"Tx Checkout → Venda",    fmt:fPct, meta:isFeo?null:METAS_T.txChkVnd.val, metaLbl:isFeo?"":("Meta 18,3%")},
    {key:"connect",  lbl:"Connect Rate",           fmt:fPct, meta:isFeo?null:METAS_T.connect.val,   metaLbl:isFeo?"":("Meta 70%")},
  ];

                const p=pl.toLowerCase();
                if(p.includes("reel"))    return "Reels";
                if(p.includes("feed"))    return "Feed";
                if(p.includes("storie"))  return "Stories";
                if(p.includes("instream"))return "In-stream Video";
                if(p.includes("explore")) return "Explore";

              };

                const p=pl.toLowerCase();
                if(p.includes("instagram"))return "instagram";
                if(p.includes("facebook")) return "facebook";
                if(p.includes("messenger"))return "messenger";
                return "";
              };
              const platLabel=pl=>{const m={instagram:"Instagram",facebook:"Facebook",messenger:"Messenger"};return m[pl]||pl;};
              const dotColor=pl=>pl==="instagram"?"#e1306c":pl==="facebook"?"#1877f2":"var(--hint)";
              return sorted.map(([pl,v],i)=>{
                const pk=platKey(pl);
                const platSpend=(mp[pk]||{spend:0}).spend;
                const platQtd=(vp[pk]||{qtd:0}).qtd;

                const cpv=v.qtd>0&&estSpend>0?estSpend/v.qtd:0;
                const roas=estSpend>0?v.valor/estSpend:0;
                const bg=i%2===0?"transparent":"rgba(255,255,255,0.02)";
                const dc=dotColor(pk);
                return `<tr style="background:${bg}">
                  <td style="padding:8px 12px;color:var(--text)">${fmtLabel(pl)}</td>
                  <td style="padding:8px 12px"><span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${dc}22;color:${dc}">${platLabel(pk)}</span></td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text-strong);font-weight:600">${v.qtd}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${cpv>0?fBRL(cpv):"—"}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${fBRL(v.valor)}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:${roas>=1?"#22c55e":roas>0?"#f59e0b":"var(--hint)"};font-weight:600">${roas>0?roas.toFixed(2)+"x":"—"}</td>

    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    if(em) ks.push("e:"+em);
    if(cpf) ks.push("c:"+cpf);
    if(tel) ks.push("t:"+tel);
    return ks;
  }
  for(const r of dd.funilRows){
    const ks=_getIdKeys(r);if(!ks.length)continue;
    let canonical=null;
    for(const k of ks){if(_identMap.has(k)){canonical=_identMap.get(k);break;}}
    if(!canonical) canonical=ks[0];
    for(const k of ks) _identMap.set(k,canonical);
  }
  function _getCanonical(r){
    const ks=_getIdKeys(r);
    for(const k of ks){if(_identMap.has(k)) return _identMap.get(k);}
    return ks[0]||null;
  }
  // adBuyersMap: adId → Set<buyerKey> (compradores do front-end atribuídos a cada adId)
  // Para Reto: só produto "reto". Para FEO: qualquer produto (sem upsells ainda)
  const adBuyersMap=new Map();
  for(const r of dd.funilRows){
    const dt=toISO(r["Data da compra"]||"")||"";
    if(dt<start||dt>end) continue;
    if((r["Status da compra"]||"").trim()!=="Paga") continue;
    if(!isFeo && classifyProduct(r["Nome do produto"]||"")!=="reto") continue;
    const adId=extractAdId(r["Ad Id"]||"");if(!adId)continue;
    const key=_getCanonical(r);if(!key)continue;
    if(!adBuyersMap.has(adId)) adBuyersMap.set(adId,new Set());
    adBuyersMap.get(adId).add(key);
  }
  // buyerTotalSpent: buyerKey → receita total do comprador (Reto + Cero + Mapa)
  // Sem filtro de data para capturar upsells que ocorrem fora do período
  const buyerTotalSpent=new Map();
  for(const r of dd.funilRows){
    if((r["Status da compra"]||"").trim()!=="Paga") continue;
    const key=_getCanonical(r);if(!key)continue;
    buyerTotalSpent.set(key,(buyerTotalSpent.get(key)||0)+(parseFloat(r["Valor do produto"])||0));
  }

  // ── 1a. País selecionado → countryAllowedIds (deve ser calculado antes de campRows)
  const hasCountryFilter=S.selectedCountry!=="todos";
  let countryAllowedIds=null;
  if(hasCountryFilter){
    const cEntry=dd.metaByCountry[S.selectedCountry];
    countryAllowedIds=cEntry?new Set([...cEntry.adIds]):new Set();
  }

  // ── 1b. Métricas por país (período filtrado) para a tabela de países ────
  const countryStats={};
  const countryBuyerSets={};
  for(const [adId,adData] of Object.entries(dd.metaByAdId)){
    const country=adData.country;
    if(!countryStats[country]) countryStats[country]={spend:0,clicks:0,impressions:0,qtd:0,funilRev:0,ic:0};
    for(const [d,vals] of Object.entries(adData.byDate)){
      if(d>=start&&d<=end){
        countryStats[country].spend+=vals.spend;
        countryStats[country].clicks+=vals.clicks;
        countryStats[country].impressions+=vals.impressions;
        countryStats[country].ic+=vals.ic||0;
      }
    }
    const vByD=dd.vendasByAdDate[adId]||{};
    for(const [vd,vv] of Object.entries(vByD)){
      if(vd>=start&&vd<=end) countryStats[country].qtd+=vv.qtd;
    }
    if(!countryBuyerSets[country]) countryBuyerSets[country]=new Set();
    for(const ek of (adBuyersMap.get(adId)||new Set())) countryBuyerSets[country].add(ek);
  }
  for(const [country,keys] of Object.entries(countryBuyerSets)){
    if(!countryStats[country]) countryStats[country]={spend:0,clicks:0,impressions:0,qtd:0,funilRev:0};
    for(const ek of keys) countryStats[country].funilRev+=(buyerTotalSpent.get(ek)||0);
  }

  // ── 1c. Constrói linhas de campanha (filtradas por país quando necessário)
  const campRows=[];
  for(const [campName,meta] of Object.entries(dd.metaByCamp)){
    const byDate=dd.metaByCampByDate[campName]||{};
    // Coleta adIds do período
    const adIdsPeriod=new Set();
    for(const [d,vals] of Object.entries(byDate)){
      if(d>=start&&d<=end) vals.adIds.forEach(id=>adIdsPeriod.add(id));
    }
    // Filtra por país se necessário
    const adIdsC=countryAllowedIds
      ? new Set([...adIdsPeriod].filter(id=>countryAllowedIds.has(id)))
      : adIdsPeriod;
    if(adIdsC.size===0) continue;
    // Spend/clicks/impressions — recalcula por adId quando país filtrado
    let cSpend=0,cClicks=0,cImpr=0,cIc=0,cLv=0,cChk=0;
    if(countryAllowedIds){
      for(const adId of adIdsC){
        const adData=dd.metaByAdId[adId];if(!adData)continue;
        for(const [d,vals] of Object.entries(adData.byDate)){
          if(d>=start&&d<=end){cSpend+=vals.spend;cClicks+=vals.clicks;cImpr+=vals.impressions;cIc+=vals.ic||0;cLv+=vals.landingViews||0;cChk+=vals.checkouts||0;}
        }
      }
    } else {
      for(const [d,vals] of Object.entries(byDate)){
        if(d>=start&&d<=end){cSpend+=vals.spend;cClicks+=vals.clicks;cImpr+=vals.impressions;cIc+=vals.ic||0;cLv+=vals.landingViews||0;cChk+=vals.checkouts||0;}
      }
    }
    if(cSpend===0) continue;
    let cQtd=0;
    for(const adId of adIdsC){
      const byD=dd.vendasByAdDate[adId]||{};
      for(const [vd,vv] of Object.entries(byD)){
        if(vd>=start&&vd<=end) cQtd+=vv.qtd;
      }
    }
    const campEvKeys=new Set();
    for(const adId of adIdsC){
      for(const ek of (adBuyersMap.get(adId)||new Set())) campEvKeys.add(ek);
    }
    let campFunilRev=0;
    for(const ek of campEvKeys) campFunilRev+=(buyerTotalSpent.get(ek)||0);
    campRows.push({campName,spend:cSpend,clicks:cClicks,impressions:cImpr,
      qtd:cQtd,valor:campFunilRev,
      cpc:cClicks>0?cSpend/cClicks:0,
      ctr:cImpr>0?(cClicks/cImpr)*100:0,
      cpm:cImpr>0?(cSpend/cImpr)*1000:0,
      cpv:cQtd>0?cSpend/cQtd:0,
      roas:cSpend>0?campFunilRev/cSpend:0,
      ticket:cQtd>0?campFunilRev/cQtd:0,
      ic:cIc, cpic:cIc>0?cSpend/cIc:0,
      connect:cClicks>0?(cLv/cClicks)*100:0,
      txPagChk:cLv>0?(cChk/cLv)*100:0,
      txChkVnd:cChk>0?(cQtd/cChk)*100:0,
      campStatus:dd.metaByCamp[campName]?.campStatus||'',
      adIds:adIdsC});
  }
  const {col:cCol,dir:cDir}=S.cSort;
  const sortedCamps=[...campRows].sort((a,b)=>{
    const av=a[cCol]??0,bv=b[cCol]??0;
    if(typeof av==="string") return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return cDir==="asc"?av-bv:bv-av;
  });
  const filteredCamps=S.campSearch.trim()
    ? sortedCamps.filter(c=>c.campName.toLowerCase().includes(S.campSearch.trim().toLowerCase()))
    : sortedCamps;
  S._campOrder=filteredCamps.map(r=>r.campName);

  // ── 2. allowedAdIds: campRows já está filtrado por país, então a interseção é automática
  const hasFilter=S.selectedCamps.size>0;
  let allowedAdIds=null;
  if(hasFilter){
    allowedAdIds=new Set();
    for(const c of campRows){
      if(S.selectedCamps.has(c.campName)) c.adIds.forEach(id=>allowedAdIds.add(id));
    }
    // campRows.adIds já foram intersectados com countryAllowedIds, não precisa reintersectar
  } else if(countryAllowedIds){
    allowedAdIds=countryAllowedIds;
  }

  // ── 3. Constrói linhas de anúncios ──────────────────────────────────────
  function buildAdRows(start,end,allowedAdIds){
    const rows=[];
    for(const [advCode,meta] of Object.entries(dd.metaByAd)){
      const byDate=dd.metaByAdByDate[advCode]||{};

      // Coleta todos os adIds deste advCode dentro do período
      const adIdsInPeriod=new Set();
      for(const [d,vals] of Object.entries(byDate)){
        if(d>=start&&d<=end) vals.adIds.forEach(id=>adIdsInPeriod.add(id));
      }
      const allIds=adIdsInPeriod.size>0?adIdsInPeriod:meta.adIds;

      // Quando há filtro de campanha, restringe aos adIds permitidos
      const useIds=allowedAdIds
        ? new Set([...allIds].filter(id=>allowedAdIds.has(id)))
        : allIds;
      if(useIds.size===0) continue;

      // Spend / clicks / impressions — calculado a partir dos adIds filtrados
      let spend=0,clicks=0,impressions=0,ic=0,video3s=0,video15s=0,landingViews=0,checkouts=0,igUrl="";
      if(allowedAdIds){
        // Usa metaByAdId para precisão por campanha
        for(const adId of useIds){
          const adData=dd.metaByAdId[adId];if(!adData)continue;
          for(const [d,vals] of Object.entries(adData.byDate)){
            if(d>=start&&d<=end){
              spend+=vals.spend;clicks+=vals.clicks;impressions+=vals.impressions;
              ic+=vals.ic||0;video3s+=vals.video3s||0;video15s+=vals.video15s||0;
              landingViews+=vals.landingViews||0;checkouts+=vals.checkouts||0;
              if(!igUrl&&vals.igUrl) igUrl=vals.igUrl;
            }
          }
        }
      } else {
        // Sem filtro: usa o agregado por advCode (mais eficiente)
        for(const [d,vals] of Object.entries(byDate)){
          if(d>=start&&d<=end){
            spend+=vals.spend;clicks+=vals.clicks;impressions+=vals.impressions;
            ic+=vals.ic||0;video3s+=vals.video3s||0;video15s+=vals.video15s||0;
            landingViews+=vals.landingViews||0;checkouts+=vals.checkouts||0;
            if(!igUrl&&vals.igUrl) igUrl=vals.igUrl;
          }
        }
      }
      if(spend===0) continue;

      // Vendas (já são por adId — basta filtrar pelos adIds certos)
      let qtd=0,valor=0,taxa=0;
      for(const adId of useIds){
        const byD=dd.vendasByAdDate[adId]||{};
        for(const [vd,vvals] of Object.entries(byD)){
          if(vd>=start&&vd<=end){qtd+=vvals.qtd;valor+=vvals.valor;taxa+=vvals.taxa;}
        }
      }
      if(!igUrl) igUrl=meta.igUrl;

      // Status: ativo se qualquer adId tiver ad+adset+camp todos ACTIVE
      let isActive=false, hasStatusData=false;
      for(const adId of useIds){
        const adData=dd.metaByAdId[adId];
        if(!adData) continue;
        if(adData.adStatus) hasStatusData=true;
        if(adData.adStatus==="ACTIVE"&&adData.adsetStatus==="ACTIVE"&&adData.campStatus==="ACTIVE"){
          isActive=true; break;
        }
      }

      // Ticket ascensão (funil completo, sem filtro de data)
      let totalAscensoes=0;
      for(const adId of useIds){
        for(const eventKey of (adBuyersMap.get(adId)||new Set())){
          totalAscensoes+=(buyerTotalSpent.get(eventKey)||0);
        }
      }
      rows.push({advCode,adName:dd.metaByAd[advCode]?.adName||advCode,campName:dd.metaByAd[advCode]?.campName||"",spend,clicks,impressions,qtd,valor,igUrl,
        cpc:clicks>0?spend/clicks:0,
        ctr:impressions>0?(clicks/impressions)*100:0,
        cpm:impressions>0?(spend/impressions)*1000:0,
        cpv:qtd>0?spend/qtd:0,
        ticket:qtd>0?valor/qtd:0,
        ticketAsc:qtd>0?totalAscensoes/qtd:0,
        roas:spend>0&&totalAscensoes>0?totalAscensoes/spend:0,
        ic, cpic:ic>0?spend/ic:0,
        connect:clicks>0?(landingViews/clicks)*100:0,
        txPagChk:landingViews>0?(checkouts/landingViews)*100:0,
        txChkVnd:checkouts>0?(qtd/checkouts)*100:0,
        hookRate:impressions>0?(video3s/impressions)*100:0,
        holdRate:video3s>0?(video15s/video3s)*100:0,
        isActive, hasStatusData});
    }
    return rows.filter(r=>r.spend>0);
  }

  const adRows=buildAdRows(start,end,allowedAdIds);

  // ── 4. Totais KPI (do período filtrado) ─────────────────────────────────
  // Se há filtro de campanhas, agrega só das campanhas selecionadas; caso contrário usa dados diários
  let tot;
  if(hasFilter){
    tot=campRows.filter(c=>S.selectedCamps.has(c.campName))
      .reduce((a,c)=>({spend:a.spend+c.spend,clicks:a.clicks+c.clicks,
        impressions:a.impressions+c.impressions,qtd:a.qtd+c.qtd,valor:a.valor+c.valor}),
        {spend:0,clicks:0,impressions:0,qtd:0,valor:0});
  } else {
    const _da=D();
    const dailyA=[];
    for(const d of Array.from(new Set([...Object.keys(_da.meta),...Object.keys(_da.vendas)])).sort()){
      if(d<start||d>end) continue;
      const m=_da.meta[d]||{spend:0,clicks:0,impressions:0};
      const v=_da.vendas[d]||{qtd:0,valor:0};
      dailyA.push({spend:m.spend,clicks:m.clicks,impressions:m.impressions,qtd:v.qtd,valor:v.valor});
    }
    tot=dailyA.reduce((a,d)=>({spend:a.spend+d.spend,clicks:a.clicks+d.clicks,
      impressions:a.impressions+d.impressions,qtd:a.qtd+d.qtd,valor:a.valor+d.valor}),
      {spend:0,clicks:0,impressions:0,qtd:0,valor:0});
  }
  const totCpc=tot.clicks>0?tot.spend/tot.clicks:0;
  const totCtr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;
  const totCpm=tot.impressions>0?(tot.spend/tot.impressions)*1000:0;
  const totCpv=tot.qtd>0?tot.spend/tot.qtd:0;
  const totTicket=tot.qtd>0?tot.valor/tot.qtd:0;
  {
    const _dd=D();const _pId="reto";
    const _bSpent=new Map(),_bPrinc=new Set();
    for(const r of _dd.funilRows){
      const dt=toISO(r["Data da compra"]||"")||"";
      if(dt<start||dt>end) continue;
      if((r["Status da compra"]||"").trim()!=="Paga") continue;
      const em=(r["Email"]||"").toLowerCase().trim();
      const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
      const id=em||cpf||tel;if(!id) continue;
      _bSpent.set(id,(_bSpent.get(id)||0)+(parseFloat(r["Valor do produto"])||0));
      if(classifyProduct(r["Nome do produto"]||"",_pId)===_pId) _bPrinc.add(id);
    }
    let _fat=0;for(const k of _bPrinc)_fat+=(_bSpent.get(k)||0);
    var totTicketAsc=_bPrinc.size>0?_fat/_bPrinc.size:0;
  }

  // ── 5. Ordenação anúncios ────────────────────────────────────────────────
  const {col,dir}=S.aSort;
  const sorted=[...adRows].sort((a,b)=>{
    const av=a[col]??0,bv=b[col]??0;
    if(typeof av==="string") return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });
  const filteredAds=S.adSearch.trim()
    ? sorted.filter(r=>r.advCode.toLowerCase().includes(S.adSearch.trim().toLowerCase()))
    : sorted;
  S._adOrder=filteredAds.map(r=>r.advCode);

  function sc(v,meta,hi){return (meta===null)?"var(--text)":statusColor(v,meta,hi);}
  function sb(v,meta,hi){return (meta===null)?"var(--border)":statusBorder(v,meta,hi);}

  function thC(col_,lbl,sortFn){
    const active=(sortFn==="camp"?cCol:col)===col_;
    const activeDir=sortFn==="camp"?cDir:dir;
    const arrow=active?(activeDir==="asc"?" ↑":" ↓"):" ↕";
    const fn=sortFn==="camp"?`sortCampanhas('${col_}')`:`sortAnuncios('${col_}')`;
    const isName=col_==="campName"||col_==="advCode";
    const align=isName?"left":"right";
    return `<th onclick="${fn}" style="padding:10px 14px;text-align:${align};font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:${active?"var(--text)":"var(--hint)"};cursor:pointer;user-select:none;border-bottom:1px solid var(--border);white-space:nowrap">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};font-size:9px;margin-left:3px">${arrow}</span></th>`;
  }

  // ── 6. Render ────────────────────────────────────────────────────────────
  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Campanhas / Anúncios</div>
        <div class="hdr-sub">atualizado em: ${dd.updated||"—"} · ${filteredCamps.length}/${sortedCamps.length} campanhas · ${filteredAds.length}/${sorted.length} anúncios${hasFilter?" · filtrando "+S.selectedCamps.size+" campanha"+(S.selectedCamps.size>1?"s":""):""}</div>
      </div>
      <div>${statusLegend()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}

    <div class="section-lbl">Resumo do período${hasFilter?" · campanhas selecionadas":""}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:13px;margin-bottom:20px">
      <div class="kc"><div class="kc-lbl">Investimento</div><div class="kc-val" style="font-size:18px">${fBRL(tot.spend)}</div></div>
      <div class="kc"><div class="kc-lbl">Vendas</div><div class="kc-val" style="font-size:18px">${tot.qtd}</div></div>
      ${(()=>{const _m=isFeo?null:META_CPV;return `<div class="kc" style="border-color:${sb(totCpv,_m,false)}"><div class="kc-lbl">Custo por Venda</div><div class="kc-val" style="color:${sc(totCpv,_m,false)};font-size:18px">${fBRL(totCpv)}</div>${_m?`<div class="kc-sub">meta ${fBRL(_m)}</div>`:""}</div>`;})()}
      <div class="kc" style="border-color:${sb(totTicket,isFeo?null:META_TICKET,true)}"><div class="kc-lbl">Ticket Médio Front</div><div class="kc-val" style="color:${sc(totTicket,isFeo?null:META_TICKET,true)};font-size:18px">${fBRL(totTicket)}</div>${isFeo?"":`<div class="kc-sub">meta ${fBRL(META_TICKET)}</div>`}</div>
      <div class="kc"><div class="kc-lbl">Ticket Médio Ascensões</div><div class="kc-val" style="font-size:18px">${fBRL(totTicketAsc)}</div><div class="kc-sub">todos os produtos</div></div>
      <div class="kc" style="border-color:${sb(totCtr,isFeo?null:METAS_T.ctr.val,true)}"><div class="kc-lbl">CTR</div><div class="kc-val" style="color:${sc(totCtr,isFeo?null:METAS_T.ctr.val,true)};font-size:18px">${fPct(totCtr)}</div>${isFeo?"":`<div class="kc-sub">meta ${fPct(METAS_T.ctr.val)}</div>`}</div>
      <div class="kc" style="border-color:${sb(totCpm,isFeo?null:METAS_T.cpm.val,false)}"><div class="kc-lbl">CPM</div><div class="kc-val" style="color:${sc(totCpm,isFeo?null:METAS_T.cpm.val,false)};font-size:18px">${fBRL(totCpm)}</div>${isFeo?"":`<div class="kc-sub">meta ${fBRL(METAS_T.cpm.val)}</div>`}</div>
    </div>

    ${(()=>{
      // Tabela de países — dinâmica, derivada dos adsets do Meta CSV
      const countries=Object.keys(countryStats).sort((a,b)=>{
        if(a==="México") return -1; if(b==="México") return 1;
        return a.localeCompare(b);
      });
      if(countries.length<=1) return "";
      const flagMap={
        "México":"🇲🇽","Argentina":"🇦🇷","Chile":"🇨🇱","Colombia":"🇨🇴",
        "Costa Rica":"🇨🇷","El Salvador":"🇸🇻","Equador":"🇪🇨","EUA":"🇺🇸",
        "Guatemala":"🇬🇹","Peru":"🇵🇪","Brasil":"🇧🇷","Portugal":"🇵🇹",
        "China":"🇨🇳","Espanha":"🇪🇸","Bolívia":"🇧🇴","Paraguai":"🇵🇾",
        "Uruguai":"🇺🇾","Venezuela":"🇻🇪","Panamá":"🇵🇦","Honduras":"🇭🇳",
        "Nicarágua":"🇳🇮","Cuba":"🇨🇺","República Dominicana":"🇩🇴",
      };
      // Linha "Todos" agrega todos os países
      const totRow={spend:0,clicks:0,impressions:0,qtd:0,funilRev:0,ic:0};
      for(const s of Object.values(countryStats)){
        totRow.spend+=s.spend;totRow.clicks+=s.clicks;
        totRow.impressions+=s.impressions;totRow.qtd+=s.qtd;totRow.funilRev+=s.funilRev;totRow.ic+=(s.ic||0);
      }
      function cpRow(c,s,isTodos){
        const sel=!isTodos&&S.selectedCountry===c;
        const bg=sel?"rgba(251,191,36,.12)":"transparent";
        const bord=sel?"border-left:3px solid #fbbf24":"border-left:3px solid transparent";
        const label=isTodos?"🌎 Todos":(flagMap[c]||"🌐")+" "+c;
        const cpc=s.clicks>0?s.spend/s.clicks:0;
        const ctr=s.impressions>0?(s.clicks/s.impressions)*100:0;
        const cpm=s.impressions>0?(s.spend/s.impressions)*1000:0;
        const cpv=s.qtd>0?s.spend/s.qtd:0;
        const roas=s.spend>0?s.funilRev/s.spend:0;
        const ticket=s.qtd>0?s.funilRev/s.qtd:0;
        const safeC=(isTodos?"todos":c).replace(/'/g,"\\'");
        return `<tr data-country="${safeC}" style="border-bottom:1px solid var(--border);background:${bg};${bord};cursor:pointer;transition:background .1s"
          onclick="selectCountry('${safeC}')"
          onmouseover="this.style.background='${sel?"rgba(251,191,36,.18)":"rgba(255,255,255,.025)"}'"
          onmouseout="this.style.background='${bg}'">
          <td style="padding:9px 14px;font-size:11px;font-weight:${sel||isTodos?"700":"500"};color:${sel?"#fbbf24":isTodos?"var(--text-strong)":"var(--text)"};white-space:nowrap">${label}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text)">${fBRL(s.spend)}</td>
